name: Build post-receipt runtime quiescence repair

on:
  push:
    branches:
      - repair/post-receipt-runtime-quiescence
    paths:
      - .github/workflows/one-shot-post-receipt-quiescence.yml

permissions:
  contents: write

jobs:
  build-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/post-receipt-runtime-quiescence
          fetch-depth: 0
      - name: Apply bounded repair and governance evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          executor = Path('apps/mcp-worker/src/executor.ts')
          text = executor.read_text()
          old = 'export const EXECUTION_ALARM_YIELD_MS = 1_000;\nexport const IMPLEMENTATION_BACKGROUND_PROCESS_COMMAND'
          new = 'export const EXECUTION_ALARM_YIELD_MS = 1_000;\nexport const POST_IMPLEMENTATION_RUNTIME_QUIESCENCE_MS = 30_000;\nexport const IMPLEMENTATION_BACKGROUND_PROCESS_COMMAND'
          if old not in text:
              raise SystemExit('executor constant anchor missing')
          text = text.replace(old, new, 1)
          old = '''      if (implementation.newlySucceeded) {\n        preserveSandbox = true;\n        return deferredExecution();\n      }'''
          new = '''      if (implementation.newlySucceeded) {\n        preserveSandbox = true;\n        return deferredExecution(Date.now() + POST_IMPLEMENTATION_RUNTIME_QUIESCENCE_MS);\n      }'''
          if old not in text:
              raise SystemExit('newlySucceeded anchor missing')
          executor.write_text(text.replace(old, new, 1))

          test = Path('apps/mcp-worker/test/executor.test.ts')
          text = test.read_text()
          old = 'IMPLEMENTATION_START_ATTEMPTS, PUBLIC_CLONE_MAX_ATTEMPTS'
          new = 'IMPLEMENTATION_START_ATTEMPTS, POST_IMPLEMENTATION_RUNTIME_QUIESCENCE_MS, PUBLIC_CLONE_MAX_ATTEMPTS'
          if old not in text:
              raise SystemExit('test import anchor missing')
          text = text.replace(old, new, 1)
          anchor = '''  it("keeps each alarm slice below the Durable Object alarm wall-time boundary", () => {\n    expect(HOSTED_ALARM_COMMAND_TIMEOUT_MS).toBe(600_000);\n    expect(EXECUTION_ALARM_YIELD_MS).toBe(1_000);\n    expect(executionResumeAtMs(1_000)).toBe(2_000);\n  });\n'''
          addition = anchor + '''\n  it("allows the managed implementation connection to quiesce before validation", () => {\n    expect(POST_IMPLEMENTATION_RUNTIME_QUIESCENCE_MS).toBe(30_000);\n    expect(POST_IMPLEMENTATION_RUNTIME_QUIESCENCE_MS).toBeGreaterThan(15_387);\n  });\n'''
          if anchor not in text:
              raise SystemExit('test insertion anchor missing')
          test.write_text(text.replace(anchor, addition, 1))

          ledger_path = Path('governance/project-ledger.json')
          ledger_text = ledger_path.read_text()
          ledger = json.loads(ledger_text)
          if any(story.get('id') == 'E-036' for story in ledger['evidenceStories']):
              raise SystemExit('E-036 already exists')
          story = {
            "id": "E-036",
            "date": "2026-09-03",
            "identity": "Issue 112 post-receipt runtime-connection interruption",
            "situation": "Fresh quota-unblocked canary issue 112 admitted exactly one implementation launch and the tracked waiter exited zero after about 224 seconds. The authoritative receipt path reconciled the implementation before validation: post-receipt git rev-parse HEAD and git diff --check both succeeded, then npm ci was interrupted 15.387 seconds later while the Sandbox RPC runtime connection was closing.",
            "verification": "Production telemetry for run 60ec7f6a-dfe9-47f8-aafc-0d8836b6e472 recorded the exact tracked process exitCode 0, sessionless post-receipt git rev-parse HEAD exitCode 0, git diff --check exitCode 0, followed by npm ci OperationInterruptedError: Sandbox operation commands.execute was interrupted while the runtime connection was closing. The run then stopped BLOCKED_CAPABILITY with install-node could not execute. No donestate/run branch, pull request or OpsTruth decision was published. Cloudflare stable Sandbox guidance keeps enableDefaultSession false and permits workflow isolation; this repair does not change Sandbox 0.12.9, RPC, Codex 0.150.1, process identity, receipt authority, retry count, publication authority or verifier contract.",
            "accountability": {
              "owner": "DoneState maintainers",
              "status": "active",
              "nextAction": "Require the bounded post-receipt runtime-quiescence repair to pass exact-head core (22), core (24), hosted-plugin and governance checks; merge and deploy it; then create one fresh successor canary and require the complete issue to run to branch to PR to exact-head CI to OpsTruth v2 to DoneState VERIFIED chain without merging the canary PR.",
              "waitCondition": "Issue 112 and run 60ec7f6a-dfe9-47f8-aafc-0d8836b6e472 remain immutable BLOCKED_CAPABILITY evidence. Never retry or reuse that run. The successor must use a fresh execution identity after the repair is deployed.",
              "staleDate": "2026-09-10"
            },
            "outcome": "The implementation layer is now proven to reach an authoritative receipt; the remaining blocker is isolated to validation starting while the prior managed process runtime connection is still closing.",
            "content": "Exact issue-112 run, tracked waiter zero exit, receipt-gated post-implementation continuity, successful diff check, npm-ci RPC interruption, immutable historical boundary, and bounded quiescence repair gate.",
            "measurement": "One implementation launch, one tracked waiter zero exit after about 224 seconds, two successful post-receipt repository commands, one npm ci interrupted after 15.387 seconds, zero canary branches, zero canary PRs and zero OpsTruth decisions."
          }
          marker = '\n  ]\n}\n'
          if not ledger_text.endswith(marker):
              raise SystemExit('unexpected ledger ending')
          insertion = ',\n    ' + json.dumps(story, separators=(',', ':')) + marker
          ledger_path.write_text(ledger_text[:-len(marker)] + insertion)
          PY
          node scripts/render-project-state.mjs
          git rm .github/workflows/one-shot-post-receipt-quiescence.yml
          git diff --check
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ayobami Haastrup"
          git config user.email "47716486+AyobamiH@users.noreply.github.com"
          git add apps/mcp-worker/src/executor.ts apps/mcp-worker/test/executor.test.ts governance/project-ledger.json docs/PROJECT-STATE.md
          git commit -m "Quiesce Sandbox runtime before validation"
          git push origin HEAD:repair/post-receipt-runtime-quiescence

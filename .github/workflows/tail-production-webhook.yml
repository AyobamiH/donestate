name: Tail production webhook

on:
  push:
    branches:
      - ops/tail-replacement-canary-68

permissions:
  contents: read

jobs:
  tail:
    if: github.event.head_commit.message == 'Tail successor canary queue'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tail production Worker for 180 seconds
        working-directory: apps/mcp-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -uo pipefail
          status=0
          timeout 180s npx --yes wrangler@4.127.0 tail --format json || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi

name: Align Cloudflare Sandbox layer

on:
  push:
    branches:
      - repair/align-cloudflare-sandbox-0.12.9

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Run Sandbox version alignment repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Apply one-variable Sandbox alignment
        run: node scripts/tmp-align-sandbox-layer.mjs
      - name: Render governance state
        run: |
          npm ci
          npm run governance:render
      - name: Root validation
        run: npm run check
      - name: Hosted Worker validation
        working-directory: apps/mcp-worker
        run: |
          npm ci
          npm run check
      - name: Governance impact
        env:
          BASE_SHA: 9f0058975321b6f9b9075aee48cae9840cae39b6
        run: npm run governance:impact -- "$BASE_SHA"
      - name: Publish exact review commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/align-sandbox-layer.yml scripts/tmp-align-sandbox-layer.mjs
          expected=$(cat <<'EOF'
          apps/mcp-worker/Dockerfile
          apps/mcp-worker/package-lock.json
          apps/mcp-worker/package.json
          apps/mcp-worker/scripts/check-sandbox-version-sync.mjs
          docs/PROJECT-STATE.md
          governance/project-ledger.json
          EOF
          )
          actual=$(git diff --name-only 9f0058975321b6f9b9075aee48cae9840cae39b6...HEAD; git diff --name-only; git ls-files --others --exclude-standard)
          actual=$(printf '%s\n' "$actual" | sed '/^$/d' | sort -u)
          expected=$(printf '%s\n' "$expected" | sed 's/^          //' | sed '/^$/d' | sort -u)
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected review surface" >&2
            echo "Expected:" >&2; printf '%s\n' "$expected" >&2
            echo "Actual:" >&2; printf '%s\n' "$actual" >&2
            exit 1
          fi
          git config user.name 'Ayobami Haastrup'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add apps/mcp-worker/Dockerfile apps/mcp-worker/package-lock.json apps/mcp-worker/package.json apps/mcp-worker/scripts/check-sandbox-version-sync.mjs docs/PROJECT-STATE.md governance/project-ledger.json
          git add -u .github/workflows/align-sandbox-layer.yml scripts/tmp-align-sandbox-layer.mjs
          git diff --cached --check
          git commit -m 'Align Cloudflare Sandbox SDK and image'
          git push origin HEAD

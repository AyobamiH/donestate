name: Inspect canary 110 admission
on:
  push:
    branches: [ops/diagnose-canary-108]
permissions:
  contents: read
jobs:
  query:
    if: github.event.head_commit.message == 'Inspect canary 110 admission'
    runs-on: ubuntu-latest
    steps:
      - name: Recover canary 110 run identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          query() {
            local needle="$1" response="$RUNNER_TEMP/response.json"
            jq -n --arg needle "$needle" '{queryId:"canary-110-admission",timeframe:{from:1788464370000,to:1788466200000},view:"events",limit:500,parameters:{datasets:[],filterCombination:"and",filters:[],limit:300,needle:{value:$needle,isRegex:false,matchCase:false}}}' > "$RUNNER_TEMP/request.json"
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/request.json" > "$response"
            jq -c --arg needle "$needle" '
              def scalar_pairs:
                paths(scalars) as $p
                | {path: ($p | map(tostring) | join(".")), value: getpath($p)};
              {
                needle:$needle,
                count:(.result.events.count // 0),
                signals:[
                  ((.result.events.events // []) | to_entries[]) as $entry
                  | ($entry.value | scalar_pairs)
                  | select(.path | test("message|run|issue|state|status|receipt|branch|pull|implement|verif|error|time|id|objective|action|event|command|process|service|session|container|finding";"i"))
                  | select((.value|tostring|length) < 1200)
                  | {event:$entry.key,path:.path,value:.value}
                ][0:400]
              }' "$response"
          }
          query "tracked-waiter receipt canary"
          query "maintenance repair queued from issue webhook"
          query "110"
          query "run_queued"

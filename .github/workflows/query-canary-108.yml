name: Inspect canary 108 queue identity
on:
  push:
    branches: [ops/diagnose-canary-108]
permissions:
  contents: read
jobs:
  query:
    if: github.event.head_commit.message == 'Inspect canary 108 queue identity'
    runs-on: ubuntu-latest
    steps:
      - name: Inspect exact process exit and control-file evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          query() {
            local from="$1" to="$2" needle="$3" response="$RUNNER_TEMP/response.json"
            jq -n --argjson from "$from" --argjson to "$to" --arg needle "$needle" '{queryId:"canary-process-exit-control",timeframe:{from:$from,to:$to},view:"events",limit:500,parameters:{datasets:[],filterCombination:"and",filters:[],limit:300,needle:{value:$needle,isRegex:false,matchCase:false}}}' > "$RUNNER_TEMP/request.json"
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/request.json" > "$response"
            jq -c --arg needle "$needle" '{needle:$needle,count:(.result.events.count // 0),events:[(.result.events.events // [])[] | {source:(.source | {event,command,pid,processId,commandId,sessionId,exitCode,errorMessage,timestamp}),metadata:(.$metadata | {message,error}),container:(.$containers | {deploymentId,placementId,applicationId,processId,container})}][0:50]}' "$response"
          }
          FROM105=1788443000000
          TO105=1788450000000
          FROM108=1788460200000
          TO108=1788462600000
          query "$FROM105" "$TO105" "donestate-implement-70310be5-5abe-413f-9643-f9e8e2425cc2"
          query "$FROM105" "$TO105" "implementation-70310be5-5abe-413f-9643-f9e8e2425cc2.sh"
          query "$FROM105" "$TO105" "implementation-70310be5-5abe-413f-9643-f9e8e2425cc2.log"
          query "$FROM108" "$TO108" "donestate-implement-a0ae892d-1aeb-4f72-bd8b-f82bf94e6022"
          query "$FROM108" "$TO108" "implementation-a0ae892d-1aeb-4f72-bd8b-f82bf94e6022.sh"
          query "$FROM108" "$TO108" "implementation-a0ae892d-1aeb-4f72-bd8b-f82bf94e6022.log"

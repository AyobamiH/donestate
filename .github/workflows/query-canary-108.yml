name: Inspect canary 108 queue identity
on:
  push:
    branches: [ops/diagnose-canary-108]
permissions:
  contents: read
jobs:
  query:
    if: github.event.head_commit.message == 'Inspect canary 108 queue identity'
    runs-on: ubuntu-latest
    steps:
      - name: Query exact canary process signals
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          query() {
            local needle="$1" response="$RUNNER_TEMP/response.json"
            jq -n --arg needle "$needle" '{queryId:"canary-108-exact-process",timeframe:{from:1788460200000,to:1788462600000},view:"events",limit:500,parameters:{datasets:[],filterCombination:"and",filters:[],limit:300,needle:{value:$needle,isRegex:false,matchCase:false}}}' > "$RUNNER_TEMP/request.json"
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/request.json" > "$response"
            jq -c --arg needle "$needle" '
              def scalar_pairs:
                paths(scalars) as $p
                | {path: ($p | map(tostring) | join(".")), value: getpath($p)};
              {
                needle: $needle,
                count: (.result.events.count // 0),
                signals: [
                  ((.result.events.events // []) | to_entries[]) as $entry
                  | ($entry.value | scalar_pairs)
                  | select(.path | test("message|run|issue|state|status|receipt|branch|pull|implement|verif|attest|error|time|id|objective|action|event|command|process|service|script|session|container"; "i"))
                  | select((.value | tostring | length) < 1200)
                  | {event: $entry.key, path: .path, value: .value}
                ][0:300]
              }' "$response"
          }
          query "a0ae892d-1aeb-4f72-bd8b-f82bf94e6022"
          query "donestate-implement-a0ae892d-1aeb-4f72-bd8b-f82bf94e6022"
          query "implementation-a0ae892d-1aeb-4f72-bd8b-f82bf94e6022"
          query "setsid -f"
          query "codex --ask-for-approval never"
          query "implementation_terminal_receipt_unavailable_before_deadline"

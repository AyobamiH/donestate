name: Inspect canary 108 queue identity
on:
  push:
    branches: [ops/diagnose-canary-108]
permissions:
  contents: read
jobs:
  query:
    if: github.event.head_commit.message == 'Inspect canary 108 queue identity'
    runs-on: ubuntu-latest
    steps:
      - name: Compare canary 105 and 108 process lifetime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          query() {
            local from="$1" to="$2" needle="$3" response="$RUNNER_TEMP/response.json"
            jq -n --argjson from "$from" --argjson to "$to" --arg needle "$needle" '{queryId:"canary-process-compare",timeframe:{from:$from,to:$to},view:"events",limit:500,parameters:{datasets:[],filterCombination:"and",filters:[],limit:300,needle:{value:$needle,isRegex:false,matchCase:false}}}' > "$RUNNER_TEMP/request.json"
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/request.json" > "$response"
            jq -c --arg needle "$needle" '
              def scalar_pairs:
                paths(scalars) as $p
                | {path: ($p | map(tostring) | join(".")), value: getpath($p)};
              {
                needle: $needle,
                count: (.result.events.count // 0),
                signals: [
                  ((.result.events.events // []) | to_entries[]) as $entry
                  | ($entry.value | scalar_pairs)
                  | select(.path | test("message|run|issue|state|status|receipt|implement|error|time|id|event|command|process|service|session|container"; "i"))
                  | select((.value | tostring | length) < 1200)
                  | {event: $entry.key, path: .path, value: .value}
                ][0:300]
              }' "$response"
          }
          FROM105=1788443000000
          TO105=1788450000000
          query "$FROM105" "$TO105" "70310be5-5abe-413f-9643-f9e8e2425cc2"
          query "$FROM105" "$TO105" "donestate-implement-70310be5-5abe-413f-9643-f9e8e2425cc2"
          query "$FROM105" "$TO105" "implementation-70310be5-5abe-413f-9643-f9e8e2425cc2"
          query "$FROM105" "$TO105" "codex --ask-for-approval never"
          query "$FROM105" "$TO105" "process.exit success /bin/sh"

name: Inspect canary 112 execution
on:
  push:
    branches: [ops/diagnose-canary-108]
permissions:
  contents: read
jobs:
  query:
    if: github.event.head_commit.message == 'Inspect canary 112 execution'
    runs-on: ubuntu-latest
    steps:
      - name: Query exact run and receipt signals
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          now=$(date +%s000)
          from=$((now - 1800000))
          query() {
            local needle="$1" response="$RUNNER_TEMP/response.json"
            jq -n --arg needle "$needle" --argjson from "$from" --argjson to "$now" '{queryId:"canary-112-execution",timeframe:{from:$from,to:$to},view:"events",limit:500,parameters:{datasets:[],filterCombination:"and",filters:[],limit:300,needle:{value:$needle,isRegex:false,matchCase:false}}}' > "$RUNNER_TEMP/request.json"
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/request.json" > "$response"
            jq -c --arg needle "$needle" '
              def scalar_pairs:
                paths(scalars) as $p
                | {path: ($p | map(tostring) | join(".")), value: getpath($p)};
              {needle:$needle,count:(.result.events.count // 0),signals:[
                ((.result.events.events // []) | to_entries[]) as $entry
                | ($entry.value | scalar_pairs)
                | select(.path | test("message|run|issue|state|status|receipt|branch|pull|implement|verif|attest|error|time|id|objective|action|event|command|process|service|session|container|exitCode";"i"))
                | select((.value|tostring|length) < 1600)
                | {event:$entry.key,path:.path,value:.value}
              ][0:500]}' "$response"
          }
          query "60ec7f6a-dfe9-47f8-aafc-0d8836b6e472"
          query "donestate-implement-60ec7f6a-dfe9-47f8-aafc-0d8836b6e472"
          query "implementation-60ec7f6a-dfe9-47f8-aafc-0d8836b6e472"
          query "codex --ask-for-approval never"
          query "implementation receipt"
          query "DoneState run stopped"
          query "AWAITING_VERIFICATION"

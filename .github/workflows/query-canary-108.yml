name: Normalize tracked-waiter governance diff
on:
  push:
    branches: [ops/diagnose-canary-108]
permissions:
  contents: write
jobs:
  normalize:
    if: github.event.head_commit.message == 'Normalize tracked-waiter governance diff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/wait-detached-receipt-worker
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Restore repository-native ledger formatting and reapply E-034 surgically
        shell: bash
        run: |
          set -euo pipefail
          git show 65c8856b58e1c451673a561c8e920a93e77af721:governance/project-ledger.json > governance/project-ledger.json
          python3 - <<'PY'
          from pathlib import Path
          import json

          path = Path('governance/project-ledger.json')
          text = path.read_text()

          def patch_work_item(text, item_id, old_next, new_next, old_wait, new_wait):
              marker = f'"id":"{item_id}"'
              start = text.index(marker)
              end = text.index('\n    },\n    {', start)
              segment = text[start:end]
              if segment.count(old_next) != 1:
                  raise SystemExit(f'{item_id}: expected one old nextAction')
              if segment.count(old_wait) != 1:
                  raise SystemExit(f'{item_id}: expected one old waitCondition')
              if segment.count('"E-033"]') != 1:
                  raise SystemExit(f'{item_id}: expected E-033 evidence tail')
              segment = segment.replace(old_next, new_next, 1)
              segment = segment.replace(old_wait, new_wait, 1)
              segment = segment.replace('"E-033"]', '"E-033","E-034"]', 1)
              return text[:start] + segment + text[end:]

          old6_next = 'Review PR 107 after canonical governance closure and exact-head CI. If all required checks pass, merge and deploy the isolated startProcess session-detachment repair, then launch one fresh successor canary. Preserve the atomic terminal receipt as the sole completion authority, exactly one implementation launch, Sandbox 0.12.9, RPC, keepAlive, sessionless execution, Codex 0.150.1, PR-only canary publication and OpsTruth v2.'
          new6_next = 'Review the tracked-waiter startProcess repair on repair/wait-detached-receipt-worker. Require exact-head core (22), core (24), hosted-plugin and governance impact success; if reviewed and green, merge and deploy it, then launch exactly one fresh PR-only maintenance canary. Preserve the terminal receipt as the sole implementation completion authority, exactly one startProcess launch, Sandbox 0.12.9, RPC, keepAlive, sessionless execution, Codex 0.150.1, PR-only canary publication and OpsTruth v2.'
          old6_wait = 'Issue 105 / run 70310be5-5abe-413f-9643-f9e8e2425cc2 is terminal AMBIGUOUS_EFFECT: clone succeeded, exactly one startProcess launch was acknowledged, but no matching donestate.implementation-receipt.v1 appeared before the deadline; no validation, publication or OpsTruth verification followed. Draft PR 107 changes only the startProcess launch command to enter an independent Unix session with `setsid -f` and versions the durable execution mode. Its first exact-head CI workflow 33788125800 passed hosted-plugin and both npm run check paths, while core (22) failed only because governance/project-ledger.json and generated docs/PROJECT-STATE.md had not yet been updated; core (24) was then cancelled. Cloudflare sandbox-sdk issue 891 is supporting evidence for a managed-session process-tree lifetime defect and reports `setsid -f` as a mitigation, but it is not treated as proof that issue 105 hit the identical SDK defect.'
          new6_wait = 'Issue 108 / run a0ae892d-1aeb-4f72-bd8b-f82bf94e6022 is immutable terminal AMBIGUOUS_EFFECT. The deployed setsid -f launcher was acknowledged once; Cloudflare telemetry recorded process.start followed by process.exit exitCode 0 after about 174 ms, while no matching terminal receipt or implementation log was present at the deadline, no Codex command was observed, and no validation, publication or OpsTruth verification followed. Issue 105 remains separate immutable AMBIGUOUS_EFFECT evidence. The next repair combines the independent session with a tracked waiter using setsid -f -w; this is an isolated hypothesis and is not success until a fresh successor reaches terminal VERIFIED.'
          text = patch_work_item(text, 'VERIFY-006', old6_next, new6_next, old6_wait, new6_wait)

          old4_next = 'After PR 107 is green, reviewed, merged and deployed, create exactly one fresh PR-only maintenance canary. Require one durable run, exactly one implementation launch, a verified terminal receipt, validation, one `donestate/<run-id>` branch and pull request, exact-head core (22), core (24) and hosted-plugin checks, a complete OpsTruth v2 response, and truthful DoneState VERIFIED read-back while leaving the canary PR unmerged.'
          new4_next = 'After the tracked-waiter repair is exact-head green, reviewed, merged and deployed, create exactly one fresh PR-only maintenance canary. Require one durable run, exactly one implementation launch, a verified terminal receipt, validation, one `donestate/<run-id>` branch and pull request, exact-head core (22), core (24) and hosted-plugin checks, a complete OpsTruth v2 response, and truthful DoneState VERIFIED read-back while leaving the canary PR unmerged.'
          old4_wait = 'Issue 105 / run 70310be5-5abe-413f-9643-f9e8e2425cc2 is immutable terminal AMBIGUOUS_EFFECT evidence and cannot be the successor. The fresh successor is blocked only until PR 107 is exact-head green, merged and deployed. No intermediate AWAITING_VERIFICATION, uncertain, branch creation, PR creation or CI success is the end-to-end success condition.'
          new4_wait = 'Issues 105 and 108 and their runs are immutable terminal AMBIGUOUS_EFFECT evidence and cannot be reused or relaunched. Issue 108 disproved setsid -f alone as sufficient for the receipt worker: its tracked launcher exited 0 in about 174 ms but produced no durable receipt, log, Codex evidence, branch, PR or verifier subject. A fresh successor is blocked only until the tracked-waiter repair is reviewed, merged and deployed. No AWAITING_VERIFICATION, uncertain result, branch creation, PR creation or CI success is the end-to-end success condition.'
          text = patch_work_item(text, 'VERIFY-004', old4_next, new4_next, old4_wait, new4_wait)

          if '"id":"E-034"' in text:
              raise SystemExit('E-034 unexpectedly exists in restored main ledger')
          story = {
              'id': 'E-034',
              'date': '2026-09-03',
              'identity': 'Issue 108 setsid canary preserved; tracked-waiter receipt repair isolated',
              'situation': 'Fresh successor issue 108 tested the deployed setsid -f startProcess receipt launch after PR 107. The required end-to-end chain did not reach publication, so OpsTruth never had a canary PR to verify.',
              'verification': 'DoneState production converged duplicate issue deliveries on run a0ae892d-1aeb-4f72-bd8b-f82bf94e6022 and stopped it terminal AMBIGUOUS_EFFECT. Read-only Cloudflare telemetry captured the single process ID donestate-implement-a0ae892d-1aeb-4f72-bd8b-f82bf94e6022: process.start at 2026-09-03T18:31:29.365Z, process.exit exitCode 0 at 2026-09-03T18:31:29.491Z, and command.stream exitCode 0 at 2026-09-03T18:31:29.495Z. At the deadline both /workspace/.donestate-control/implementation-a0ae892d-1aeb-4f72-bd8b-f82bf94e6022.receipt and .log were absent, no Codex command matched telemetry, and no validation, branch, pull request or verifier activity followed. Diagnostic workflow 33796337929 job 100784808192 captured the exact provider process and file evidence; issue 108 is preserved and will not be retried.',
              'accountability': {
                  'owner': 'DoneState maintainers',
                  'status': 'active',
                  'nextAction': 'Review, merge and deploy only the isolated tracked-waiter repair after exact-head CI, then launch one fresh successor canary and require terminal VERIFIED with its PR unmerged.',
                  'waitCondition': 'The tracked-waiter repair is not yet reviewed, merged or deployed; issue 108 cannot be reused.',
                  'staleDate': '2026-09-10'
              },
              'outcome': 'Issue 108 is immutable terminal AMBIGUOUS_EFFECT evidence. setsid -f alone is not sufficient for DoneState receipt durability; the next bounded repair keeps an independent session child while retaining a tracked waiter with setsid -f -w.',
              'content': 'Exact run identity, one launch, provider process start/exit, missing terminal receipt and log, absent Codex evidence, no publication, and the bounded tracked-waiter repair hypothesis.',
              'measurement': 'One fresh run; one acknowledged startProcess launch; one tracked launcher exitCode 0 after about 174 ms; zero terminal receipts, zero implementation logs, zero observed Codex starts, zero canary branches/PRs and zero OpsTruth decisions.'
          }
          story_text = (
              '    ,{\n'
              f'      "id":"E-034","date":"2026-09-03","identity":{json.dumps(story["identity"])},"situation":{json.dumps(story["situation"])},"verification":{json.dumps(story["verification"])},\n'
              f'      "accountability":{json.dumps(story["accountability"], separators=(",", ":"))},\n'
              f'      "outcome":{json.dumps(story["outcome"])},"content":{json.dumps(story["content"])},"measurement":{json.dumps(story["measurement"])}\n'
              '    }'
          )
          close = '\n  ]\n}\n'
          idx = text.rfind(close)
          if idx < 0:
              raise SystemExit('could not locate final evidenceStories close')
          text = text[:idx] + '\n' + story_text + text[idx:]
          path.write_text(text)
          PY
          npm run governance:render
          npm ci
          npm run governance:check
          npm run governance:impact -- 65c8856b58e1c451673a561c8e920a93e77af721
          git diff --check
          git diff --stat 65c8856b58e1c451673a561c8e920a93e77af721..HEAD || true
          git diff -- governance/project-ledger.json docs/PROJECT-STATE.md
      - name: Commit compact governance closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Ayobami Haastrup'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add governance/project-ledger.json docs/PROJECT-STATE.md
          git commit -m 'Keep canary 108 evidence compact'
          git push origin HEAD:repair/wait-detached-receipt-worker

name: Inspect One Click Pages Production

on:
  push:
    branches:
      - ops/inspect-oneclick-pages
    paths:
      - ".github/workflows/inspect-oneclick-pages.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Require existing Cloudflare custody
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Read Pages project metadata
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const project = "oneclickwebsitedesignfactory";
          const headers = { Authorization: `Bearer ${token}`, "Content-Type": "application/json" };

          async function cf(path) {
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}${path}`, { headers });
            const body = await response.json();
            if (!response.ok || body.success !== true) {
              console.error(JSON.stringify({ status: response.status, errors: body.errors ?? [] }));
              process.exit(1);
            }
            return body.result;
          }

          const p = await cf(`/pages/projects/${project}`);
          const deployments = await cf(`/pages/projects/${project}/deployments?env=production&per_page=5`);

          const sanitised = {
            project: {
              name: p.name,
              subdomain: p.subdomain,
              production_branch: p.production_branch,
              domains: p.domains,
              source: p.source
                ? {
                    type: p.source.type,
                    owner: p.source.config?.owner,
                    repo_name: p.source.config?.repo_name,
                    production_branch: p.source.config?.production_branch,
                    deployments_enabled: p.source.config?.deployments_enabled,
                  }
                : null,
              latest_production_deployment: p.latest_production_deployment
                ? {
                    id: p.latest_production_deployment.id,
                    url: p.latest_production_deployment.url,
                    environment: p.latest_production_deployment.environment,
                    branch: p.latest_production_deployment.deployment_trigger?.metadata?.branch,
                    commit_hash: p.latest_production_deployment.deployment_trigger?.metadata?.commit_hash,
                    created_on: p.latest_production_deployment.created_on,
                    status: p.latest_production_deployment.latest_stage?.status,
                  }
                : null,
            },
            production_deployments: deployments.map((d) => ({
              id: d.id,
              url: d.url,
              environment: d.environment,
              branch: d.deployment_trigger?.metadata?.branch,
              commit_hash: d.deployment_trigger?.metadata?.commit_hash,
              created_on: d.created_on,
              status: d.latest_stage?.status,
            })),
          };
          console.log(JSON.stringify(sanitised, null, 2));
          NODE

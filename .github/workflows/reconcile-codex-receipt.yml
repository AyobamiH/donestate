name: Validate Codex terminal receipt repair

on:
  push:
    branches:
      - repair/reconcile-codex-receipt

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Run terminal receipt repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Correct staging-helper shell interpolation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/tmp-reconcile-codex-receipt.mjs')
          text = path.read_text()
          old = 'tmp_path="${receipt_path}.tmp.$$"'
          new = 'tmp_path="\\${receipt_path}.tmp.$$"'
          if text.count(old) != 1:
              raise SystemExit('receipt path interpolation context drift')
          path.write_text(text.replace(old, new))
          PY
      - name: Apply terminal receipt correction
        run: node scripts/tmp-reconcile-codex-receipt.mjs
      - name: Correct emitted receipt command quoting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/mcp-worker/src/executor.ts')
          lines = path.read_text().splitlines()
          matches = [i for i, line in enumerate(lines) if 'printf ' in line and 'receipt_schema' in line and 'tmp_path' in line]
          if len(matches) != 1:
              raise SystemExit('emitted receipt printf context drift')
          lines[matches[0]] = '    "printf \'%s\\\\t%s\\\\t%s\\\\t%s\\\\t%s\\\\n\' \\"$receipt_schema\\" \\"$receipt_run_id\\" \\"$receipt_command_digest\\" \\"$exit_code\\" \\"$receipt_nonce\\" > \\"$tmp_path\\"",'
          path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Install root dependencies
        run: npm ci
      - name: Render governance state
        run: npm run governance:render
      - name: Root validation
        run: npm run check
      - name: Hosted Worker validation
        working-directory: apps/mcp-worker
        run: |
          npm ci
          npm run check
      - name: Plugin validation
        run: node scripts/validate-plugin.mjs
      - name: Prepare exact review commit
        env:
          BASE_SHA: ce16418f4176906fcf7d3243058bab474631f2fc
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reconcile-codex-receipt.yml scripts/tmp-reconcile-codex-receipt.mjs scripts/tmp-terminal-receipt-trigger.txt
          expected=$(printf '%s\n' \
            apps/mcp-worker/src/executor.ts \
            apps/mcp-worker/test/executor.test.ts \
            docs/PROJECT-STATE.md \
            governance/project-ledger.json | sort -u)
          actual=$( { git diff --name-only "$BASE_SHA"; git ls-files --others --exclude-standard; } | sed '/^$/d' | sort -u )
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected exact review surface' >&2
            echo 'Expected:' >&2; printf '%s\n' "$expected" >&2
            echo 'Actual:' >&2; printf '%s\n' "$actual" >&2
            exit 1
          fi
          git config user.name 'Ayobami Haastrup'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add apps/mcp-worker/src/executor.ts apps/mcp-worker/test/executor.test.ts docs/PROJECT-STATE.md governance/project-ledger.json
          git add -u .github/workflows/reconcile-codex-receipt.yml scripts/tmp-reconcile-codex-receipt.mjs scripts/tmp-terminal-receipt-trigger.txt
          git diff --cached --check
          git commit -m 'Reconcile Codex completion by terminal receipt'
      - name: Governance impact on exact net commit
        run: npm run governance:impact -- ce16418f4176906fcf7d3243058bab474631f2fc
      - name: Push exact review commit
        run: git push origin HEAD:repair/reconcile-codex-receipt

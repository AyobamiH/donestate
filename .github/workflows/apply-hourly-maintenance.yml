name: Apply hourly maintenance cadence

on:
  push:
    branches:
      - ops/hourly-maintenance-canary

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ops/hourly-maintenance-canary
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Apply bounded schedule and governance update
        run: |
          python .github/apply-hourly-maintenance.py
          node scripts/render-project-state.mjs
          git diff --check
      - name: Commit intended files when changed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/mcp-worker/wrangler.jsonc governance/project-ledger.json docs/PROJECT-STATE.md
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Run DoneState maintenance hourly"
          git push origin HEAD:ops/hourly-maintenance-canary

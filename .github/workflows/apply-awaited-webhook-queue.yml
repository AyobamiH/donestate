name: Apply awaited webhook queue repair

on:
  push:
    branches:
      - repair/await-webhook-maintenance-queue

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run awaited webhook queue repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bounded repair
        run: python3 .github/scripts/apply-awaited-webhook-queue.py
      - name: Install and render governance state
        run: |
          npm ci
          npm run governance:render
      - name: Run root gates
        run: npm run check
      - name: Run hosted Worker gates
        working-directory: apps/mcp-worker
        run: |
          npm ci
          npm run check
      - name: Validate and commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "DoneState Repair"
          git config user.email "bot@donestate.dev"
          git add apps/mcp-worker/src/maintenance-registry.ts
          git add apps/mcp-worker/test/maintenance-registry.test.ts
          git add governance/project-ledger.json
          git add docs/PROJECT-STATE.md
          git rm .github/workflows/apply-awaited-webhook-queue.yml
          git rm .github/scripts/apply-awaited-webhook-queue.py
          git diff --cached --check
          git commit -m "Await durable webhook repair queue setup"
          npm run governance:impact -- origin/main
          git diff --check origin/main...HEAD
          git push origin HEAD:repair/await-webhook-maintenance-queue

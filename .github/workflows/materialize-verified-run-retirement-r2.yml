name: Materialize verified run branch retirement r2

on:
  push:
    branches:
      - repair/verified-run-branch-retirement-r2

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: repair/verified-run-branch-retirement-r2
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Materialize already-gated lifecycle source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin repair/verified-run-branch-retirement
          for path in \
            apps/mcp-worker/src/github.ts \
            apps/mcp-worker/src/maintenance-registry.ts \
            apps/mcp-worker/test/maintenance-registry.test.ts \
            docs/HOSTED-PLUGIN.md
          do
            git show "origin/repair/verified-run-branch-retirement:$path" > "$path"
          done
          python .github/branch-retirement-governance-r2.py
      - name: Validate exact current-main candidate
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run governance:render
          npm run check
          (cd apps/mcp-worker && npm ci && npm run check)
          git diff --check
      - name: Commit only lasting lifecycle changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/mcp-worker/src/github.ts \
            apps/mcp-worker/src/maintenance-registry.ts \
            apps/mcp-worker/test/maintenance-registry.test.ts \
            docs/HOSTED-PLUGIN.md \
            governance/project-ledger.json \
            docs/PROJECT-STATE.md
          git rm \
            .github/branch-retirement-governance-r2.py \
            .github/workflows/materialize-verified-run-retirement-r2.yml
          git diff --cached --check
          git commit -m "Retire only merged verified DoneState run branches"
          npm run governance:impact -- origin/main
          git push origin HEAD:repair/verified-run-branch-retirement-r2

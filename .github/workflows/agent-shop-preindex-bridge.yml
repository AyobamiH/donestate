name: Agent Shop Preindex Bridge

on:
  push:
    branches:
      - ops/agent-shop-preindex-bridge
    paths:
      - ".github/workflows/agent-shop-preindex-bridge.yml"

permissions:
  contents: read

concurrency:
  group: agent-shop-preindex-bridge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACCEPTANCE_ORIGIN: https://agents.proofandstate.com
      VITE_SITE_ORIGIN: https://agents.proofandstate.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AGENT_SHOP_REVISION: edeb28b5f53713d91b79af0c7726d68eac655e57
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify Cloudflare credential custody
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Fetch canonical agent shop
        run: |
          git clone --filter=blob:none https://github.com/AyobamiH/agent-shop-products.git agent-shop-products
          cd agent-shop-products
          git checkout "$AGENT_SHOP_REVISION"
          test "$(git rev-parse HEAD)" = "$AGENT_SHOP_REVISION"
      - name: Install and build
        working-directory: agent-shop-products/frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Validate Cloudflare Worker bundle
        working-directory: agent-shop-products/frontend
        run: bunx wrangler@4.135.0 deploy --dry-run --config wrangler.jsonc --outdir /tmp/agent-shop-worker
      - name: Deploy agent-shop Worker
        working-directory: agent-shop-products/frontend
        run: bunx wrangler@4.135.0 deploy --config wrangler.jsonc
      - name: Wait for production origin
        run: |
          for i in {1..60}; do
            if curl --fail --silent --show-error --location "$ACCEPTANCE_ORIGIN/agents" >/dev/null; then
              echo "Production origin is reachable."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Production origin did not become reachable."
          exit 1
      - name: Outside-in acceptance
        working-directory: agent-shop-products/frontend
        run: node scripts/verify-deployed-surface.mjs
      - name: Verify IndexNow key file
        run: |
          test "$(curl --fail --silent --show-error https://agents.proofandstate.com/agents-proofandstate-indexnow-20261007.txt | tr -d '\r\n')" = "agents-proofandstate-indexnow-20261007"

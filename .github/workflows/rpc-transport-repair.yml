name: Validate Sandbox RPC transport repair

on:
  push:
    branches:
      - repair/sandbox-rpc-transport

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Run RPC transport repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Record exact RPC migration evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('governance/project-ledger.json')
          text = p.read_text()

          old = '''      "nextAction":"Align the Cloudflare Sandbox npm SDK and container image at exact version 0.12.9, keep Codex 0.150.1 and HTTP transport unchanged for this correction, deploy only after normal review, then launch one fresh canary to determine whether the historical intermittent sandbox.exec HTTP 500 persists.","waitCondition":"Fresh issue 79 reached implementation on Worker adebd0c4-77c3-4ed0-9135-cd1003345258 after fresh-sandbox clone succeeded, then Sandbox.exec returned HTTP 500 after 194792 ms while running the unchanged Codex 0.150.1 command. Historical successful run 5ba4e808 completed the same Codex command in 158578 ms, and older maintenance runs alternated between implementation HTTP 500 failures and successful successor PRs. Repository inspection found an unsupported Cloudflare pairing: @cloudflare/sandbox 0.12.9 with cloudflare/sandbox:0.7.0. Correct that mismatch before adding Codex retries or changing transport.","reentryCondition":"Close only after both products consume the same manifest and vectors, exact deployed versions pass a fresh replay-safe round trip, and historical run outcomes remain unchanged.","dependencies":[],"evidenceIds":["E-015","E-016","E-017","E-018","E-019","E-020","E-022","E-023"]'''
          new = '''      "nextAction":"Migrate the already-aligned Cloudflare Sandbox 0.12.9 stack from deprecated HTTP transport to RPC as the only runtime variable, keep Codex 0.150.1 and implementation/retry semantics unchanged, deploy under normal review, then launch one fresh canary through the same implementation boundary.","waitCondition":"Issue 81 proved exact SDK/image alignment alone was insufficient: Worker d67aa16a-914c-4e9a-940f-c06358e34f1b cloned successfully on the aligned 0.12.9 stack, explicitly logged HTTP transport, then the unchanged Codex 0.150.1 command again failed at Sandbox.exec with HTTP 500 after 133625 ms. Cloudflare stable documentation deprecates HTTP and recommends RPC after the staged version-alignment deployment already completed.","reentryCondition":"Close only after both products consume the same manifest and vectors, exact deployed versions pass a fresh replay-safe round trip, and historical run outcomes remain unchanged.","dependencies":[],"evidenceIds":["E-015","E-016","E-017","E-018","E-019","E-020","E-022","E-023","E-024"]'''
          if old not in text:
              raise SystemExit('VERIFY-006 context drift')
          text = text.replace(old, new, 1)

          old = '''      "nextAction":"After exact Sandbox 0.12.9 SDK/image alignment is reviewed and deployed with Codex and HTTP transport unchanged, run one fresh consequence-disabled maintenance canary through publication, exact-head CI, OpsTruth v2 response, and terminal DoneState read-back.","waitCondition":"Issue 79 failed before publication at the Cloudflare Sandbox exec boundary. The next canary must wait for the one-variable SDK/image alignment so the experiment remains attributable; do not conflate this with the later HTTP-to-RPC migration.","reentryCondition":"Resume after the versioned contract and authenticated verifier lane are deployed on exact reviewed commits.","dependencies":["VERIFY-001","VERIFY-002","VERIFY-003","VERIFY-006"],"evidenceIds":["E-002","E-003","E-012","E-016","E-017","E-018","E-019","E-020","E-022","E-023"]'''
          new = '''      "nextAction":"After RPC transport is reviewed and deployed on the aligned 0.12.9 stack, run one fresh consequence-disabled maintenance canary through Codex implementation, publication, exact-head CI, OpsTruth v2 response, and terminal DoneState read-back.","waitCondition":"Issue 81 failed before publication on the aligned 0.12.9 stack while HTTP transport remained enabled. The next canary must wait for the isolated HTTP-to-RPC migration; Codex version, command and retry behavior must remain unchanged so the result is attributable.","reentryCondition":"Resume after the versioned contract and authenticated verifier lane are deployed on exact reviewed commits.","dependencies":["VERIFY-001","VERIFY-002","VERIFY-003","VERIFY-006"],"evidenceIds":["E-002","E-003","E-012","E-016","E-017","E-018","E-019","E-020","E-022","E-023","E-024"]'''
          if old not in text:
              raise SystemExit('VERIFY-004 context drift')
          text = text.replace(old, new, 1)

          evidence = '''    ,{
      "id":"E-024","date":"2026-09-03","identity":"Aligned Sandbox canary falsified version mismatch as sole cause and isolated deprecated HTTP transport","situation":"PR 80 merged as 1c2d7cb00bc7dca82a62e2c35307cd127c1ca645 and deployed Worker d67aa16a-914c-4e9a-940f-c06358e34f1b with @cloudflare/sandbox 0.12.9 and docker.io/cloudflare/sandbox:0.12.9. Fresh issue 81 then exercised the unchanged Codex 0.150.1 implementation path with HTTP transport intentionally unchanged.","verification":"Deployment 33710162469 passed 113 Worker tests, printed Cloudflare Sandbox versions aligned at 0.12.9, and built the container from docker.io/cloudflare/sandbox:0.12.9@sha256:4a56a37a3cfd9b38d65bb4b5d0b341e6490a3a4c0226274ae4c1cca4948e85fe. Issue 81 queued on that exact Worker, anonymous clone succeeded, production observability logged Using http transport, and the unchanged Codex command failed at Sandbox.exec with HTTP 500 after 133625 ms. No branch, PR or OpsTruth call occurred. This falsifies the SDK/image mismatch as the sole cause while leaving deprecated HTTP transport as the next isolated common layer.",
      "accountability":{"owner":"DoneState maintainers","status":"active","nextAction":"Switch only SANDBOX_TRANSPORT from the deprecated HTTP default to rpc on the aligned 0.12.9 stack, add a deterministic transport guard, deploy under normal review, and launch a fresh successor canary with Codex and retry semantics unchanged.","waitCondition":"Issue 81 is terminal pre-publication evidence and must not be retried or rewritten. Do not combine the RPC migration with Codex upgrades, retries, timeout changes or verifier changes.","staleDate":"2026-09-10"},
      "outcome":"Version alignment was necessary but not sufficient. The next experiment is now correctly isolated at the Sandbox transport layer rather than the Codex execution policy.","content":"Exact aligned Worker deployment, container base digest, issue 81 clone success, HTTP transport log, 133625 ms Sandbox.exec 500, no publication and no verifier activity, plus Cloudflare staged RPC migration boundary.","measurement":"One aligned production deployment, one fresh canary, one successful anonymous clone, one HTTP transport selection, one Sandbox.exec 500 at 133625 ms, zero branches, zero PRs, zero OpsTruth calls, and zero Codex/retry changes."
    }'''
          marker = '\n  ]\n}'
          idx = text.rfind(marker)
          if idx < 0:
              raise SystemExit('evidenceStories closing marker not found')
          text = text[:idx] + evidence + text[idx:]
          p.write_text(text)
          PY
      - name: Render governance state
        run: |
          npm ci
          npm run governance:render
      - name: Root validation
        run: npm run check
      - name: Hosted Worker validation
        working-directory: apps/mcp-worker
        run: |
          npm ci
          npm run check
      - name: Prepare exact review commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/rpc-transport-repair.yml
          expected=$(cat <<'EOF'
          apps/mcp-worker/scripts/check-sandbox-version-sync.mjs
          apps/mcp-worker/wrangler.jsonc
          docs/PROJECT-STATE.md
          governance/project-ledger.json
          EOF
          )
          actual=$( { git diff --name-only 1c2d7cb00bc7dca82a62e2c35307cd127c1ca645; git ls-files --others --exclude-standard; } | sed '/^$/d' | grep -v '^.github/workflows/rpc-transport-repair.yml$' | sort -u )
          expected=$(printf '%s\n' "$expected" | sed 's/^          //' | sed '/^$/d' | sort -u)
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected review surface" >&2
            echo "Expected:" >&2; printf '%s\n' "$expected" >&2
            echo "Actual:" >&2; printf '%s\n' "$actual" >&2
            exit 1
          fi
          git config user.name 'Ayobami Haastrup'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add apps/mcp-worker/scripts/check-sandbox-version-sync.mjs apps/mcp-worker/wrangler.jsonc docs/PROJECT-STATE.md governance/project-ledger.json
          git add -u .github/workflows/rpc-transport-repair.yml
          git diff --cached --check
          git commit -m 'Migrate Cloudflare Sandbox transport to RPC'
      - name: Governance impact on exact net commit
        run: npm run governance:impact -- 1c2d7cb00bc7dca82a62e2c35307cd127c1ca645
      - name: Push exact review commit
        run: git push origin HEAD

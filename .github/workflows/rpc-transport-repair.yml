name: Validate Sandbox RPC transport repair

on:
  push:
    branches:
      - repair/sandbox-rpc-transport

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Retry RPC transport repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Record RPC migration evidence
        run: node scripts/tmp-rpc-transport-repair.mjs
      - name: Render governance state
        run: npm ci && npm run governance:render
      - name: Root validation
        run: npm run check
      - name: Hosted Worker validation
        working-directory: apps/mcp-worker
        run: npm ci && npm run check
      - name: Prepare exact review commit
        run: |
          set -euo pipefail
          rm -f .github/workflows/rpc-transport-repair.yml scripts/tmp-rpc-transport-repair.mjs
          expected=$(printf '%s\n' \
            apps/mcp-worker/scripts/check-sandbox-version-sync.mjs \
            apps/mcp-worker/wrangler.jsonc \
            docs/PROJECT-STATE.md \
            governance/project-ledger.json | sort -u)
          actual=$( { git diff --name-only 1c2d7cb00bc7dca82a62e2c35307cd127c1ca645; git ls-files --others --exclude-standard; } \
            | sed '/^$/d' \
            | grep -v '^.github/workflows/rpc-transport-repair.yml$' \
            | grep -v '^scripts/tmp-rpc-transport-repair.mjs$' \
            | sort -u )
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected review surface" >&2
            echo "Expected:" >&2
            printf '%s\n' "$expected" >&2
            echo "Actual:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          git config user.name 'Ayobami Haastrup'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add apps/mcp-worker/scripts/check-sandbox-version-sync.mjs apps/mcp-worker/wrangler.jsonc docs/PROJECT-STATE.md governance/project-ledger.json
          git add -u .github/workflows/rpc-transport-repair.yml scripts/tmp-rpc-transport-repair.mjs
          git diff --cached --check
          git commit -m 'Migrate Cloudflare Sandbox transport to RPC'
      - name: Governance impact on exact net commit
        run: npm run governance:impact -- 1c2d7cb00bc7dca82a62e2c35307cd127c1ca645
      - name: Push exact review commit
        run: git push origin HEAD

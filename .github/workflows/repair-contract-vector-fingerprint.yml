name: Repair contract vector signer binding

on:
  push:
    branches:
      - repair/versioned-verification-contract-59

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Repair contract vector signer binding'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind vector fingerprints to their Ed25519 SPKI keys
        shell: bash
        run: |
          old='d13c0ed5c4b0e4a143e390c93a66cab599bacf6128bc3064e3b21db2a28176ee'
          new='c5a062a3429ffb4fe967ffb775663f98a777d0e0a2dd253e9ae370eb6590031e'
          for file in \
            schemas/vectors/verification-contract-v2-verified.json \
            schemas/vectors/verification-contract-v2-failed.json \
            schemas/vectors/verification-contract-v2-uncertain.json
          do
            grep -q "$old" "$file"
            sed -i "s/$old/$new/g" "$file"
          done
          cat > src/test/verification-vector-fingerprint.test.ts <<'EOF'
          import assert from "node:assert/strict";
          import { createHash, createPublicKey } from "node:crypto";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          test("verification compatibility vectors bind signer fingerprints to their public keys", async () => {
            for (const decision of ["verified", "failed", "uncertain"] as const) {
              const vector = JSON.parse(await readFile(
                new URL(`../../schemas/vectors/verification-contract-v2-${decision}.json`, import.meta.url),
                "utf8",
              )) as { response: { attestation: { signature: { publicKeyPem: string; signerFingerprint: string } } } };
              const der = createPublicKey(vector.response.attestation.signature.publicKeyPem).export({ type: "spki", format: "der" });
              const fingerprint = createHash("sha256").update(der).digest("hex");
              assert.equal(vector.response.attestation.signature.signerFingerprint, fingerprint, decision);
            }
          });
          EOF
      - name: Validate root
        run: |
          npm ci --ignore-scripts
          npm run check
      - name: Validate hosted Worker
        working-directory: apps/mcp-worker
        run: |
          npm ci --ignore-scripts
          npm run check
          rm -f worker-configuration.d.ts
      - name: Commit exact repair and remove scaffold
        shell: bash
        run: |
          git config user.name "Ayobami Haastrup"
          git config user.email "47716486+AyobamiH@users.noreply.github.com"
          git add -- \
            schemas/vectors/verification-contract-v2-verified.json \
            schemas/vectors/verification-contract-v2-failed.json \
            schemas/vectors/verification-contract-v2-uncertain.json \
            src/test/verification-vector-fingerprint.test.ts
          git rm -- .github/workflows/repair-contract-vector-fingerprint.yml
          git diff --cached --check
          git commit -m "Bind verification vector signer fingerprints to keys"
          git push origin HEAD:repair/versioned-verification-contract-59

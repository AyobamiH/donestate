name: Apply event-driven maintenance repair

on:
  push:
    branches:
      - repair/event-driven-maintenance-dispatch

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Apply event-driven maintenance repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bounded repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          source_path = Path("apps/mcp-worker/src/maintenance-registry.ts")
          source = source_path.read_text()

          source = replace_once(source, '''export function workflowVerificationRetryEligible(run: PublicRunRecord, repository: string, headSha: string): boolean {
            return run.state === "AWAITING_VERIFICATION"
              && run.objective.repository === repository
              && run.branchHeadSha === headSha;
          }

          function repositoryRecord(row: RepositoryRow): SelectedRepository {''', '''export function workflowVerificationRetryEligible(run: PublicRunRecord, repository: string, headSha: string): boolean {
            return run.state === "AWAITING_VERIFICATION"
              && run.objective.repository === repository
              && run.branchHeadSha === headSha;
          }

          export function webhookAutoRepairEligible(repository: SelectedRepository, finding: MaintenanceFinding): boolean {
            return repository.mode === "pr_only"
              && repository.scheduleEnabled
              && repository.autoRepair
              && repository.installationId !== null
              && repository.requiredCheckNames.length > 0
              && finding.ownerLogin === repository.ownerLogin
              && finding.repository === repository.repository
              && finding.repairEligible
              && finding.state === "OPEN";
          }

          function repositoryRecord(row: RepositoryRow): SelectedRepository {''', "webhook eligibility helper")

          source = replace_once(source, '''  private async upsertCandidates(login: string, repository: string, candidates: MaintenanceCandidate[]): Promise<void> {
            const now = new Date().toISOString();
            for (const candidate of candidates) {''', '''  private async upsertCandidates(login: string, repository: string, candidates: MaintenanceCandidate[]): Promise<MaintenanceFinding[]> {
            const now = new Date().toISOString();
            const upserted: MaintenanceFinding[] = [];
            for (const candidate of candidates) {''', "upsert return type")

          source = replace_once(source, '''        candidate.repairEligible ? 1 : 0, now, now,
              );
            }
          }

          async listFindings''', '''        candidate.repairEligible ? 1 : 0, now, now,
              );
              const row = this.ctx.storage.sql.exec<FindingRow>("SELECT * FROM findings WHERE id = ?", id).one();
              upserted.push(findingRecord(row));
            }
            return upserted;
          }

          async listFindings''', "upsert returned findings")

          source = replace_once(source, '''    const installation = await createInstallationToken(await this.appCredentials(), selected.installationId, "pr_only");
            const baseHeadSha = await getBranchHead(installation.token, selected.repository, selected.defaultBranch);
            if (!baseHeadSha) throw new Error("selected default branch does not exist");
            const runId = crypto.randomUUID();
            const objective: HostedObjective = {''', '''    const installation = await createInstallationToken(await this.appCredentials(), selected.installationId, "pr_only");
            const baseHeadSha = await getBranchHead(installation.token, selected.repository, selected.defaultBranch);
            if (!baseHeadSha) throw new Error("selected default branch does not exist");
            const runId = crypto.randomUUID();
            const claimedAt = new Date().toISOString();
            this.ctx.storage.sql.exec(
              "UPDATE findings SET state = 'REPAIR_QUEUED', run_id = ?, updated_at = ? WHERE id = ? AND owner_login = ? AND state = 'OPEN' AND repair_eligible = 1",
              runId, claimedAt, row.id, login,
            );
            const claimed = this.ctx.storage.sql.exec<FindingRow>(
              "SELECT * FROM findings WHERE id = ? AND owner_login = ?",
              row.id, login,
            ).one();
            if (claimed.run_id !== runId) {
              if (claimed.state === "REPAIR_QUEUED" && claimed.run_id) {
                return { finding: findingRecord(claimed), runId: claimed.run_id };
              }
              throw new Error("finding is not eligible for autonomous repair");
            }
            const objective: HostedObjective = {''', "claim before mutating run setup")

          source = replace_once(source, '''    await coordinator.create(objective, installation.token);
            await coordinator.start(login);
            const now = new Date().toISOString();
            this.ctx.storage.sql.exec(
              "UPDATE findings SET state = 'REPAIR_QUEUED', run_id = ?, updated_at = ? WHERE id = ? AND state = 'OPEN'",
              runId, now, row.id,
            );
            const updated = this.ctx.storage.sql.exec<FindingRow>("SELECT * FROM findings WHERE id = ?", row.id).one();''', '''    await coordinator.create(objective, installation.token);
            await coordinator.start(login);
            const updated = this.ctx.storage.sql.exec<FindingRow>("SELECT * FROM findings WHERE id = ?", row.id).one();''', "remove late repair claim")

          source = replace_once(source, '''      for (const owner of owners) {
                await this.upsertCandidates(owner.owner_login, repository, candidates);
                if (completedWorkflowHead) {
                  await this.retryVerificationForCompletedWorkflow(owner.owner_login, repository, completedWorkflowHead);
                }
              }''', '''      for (const owner of owners) {
                const upserted = await this.upsertCandidates(owner.owner_login, repository, candidates);
                const selected = repositoryRecord(owner);
                for (const finding of upserted) {
                  if (!webhookAutoRepairEligible(selected, finding)) continue;
                  this.ctx.waitUntil(this.startRepair(owner.owner_login, finding.id).then(({ runId }) => {
                    console.log(JSON.stringify({
                      message: "maintenance repair queued from issue webhook",
                      repository,
                      findingId: finding.id,
                      runId,
                    }));
                  }).catch((error) => {
                    console.error(JSON.stringify({
                      message: "maintenance issue webhook repair did not queue",
                      repository,
                      findingId: finding.id,
                      error: error instanceof Error ? error.message : "unknown repair dispatch error",
                    }));
                  }));
                }
                if (completedWorkflowHead) {
                  await this.retryVerificationForCompletedWorkflow(owner.owner_login, repository, completedWorkflowHead);
                }
              }''', "event-driven repair dispatch")

          source_path.write_text(source)

          test_path = Path("apps/mcp-worker/test/maintenance-registry.test.ts")
          test = test_path.read_text()
          test = replace_once(test, '''import { workflowVerificationRetryEligible, type MaintenanceRegistry } from "../src/maintenance-registry";
          import type { PublicRunRecord } from "../src/types";''', '''import { webhookAutoRepairEligible, workflowVerificationRetryEligible, type MaintenanceRegistry } from "../src/maintenance-registry";
          import type { MaintenanceFinding, PublicRunRecord, SelectedRepository } from "../src/types";''', "test imports")

          test = replace_once(test, '''  it("retries independent verification only for the awaiting run bound to the completed workflow head", () => {''', '''  it("dispatches issue webhooks only through the selected PR-only automatic-repair policy", () => {
            const selected: SelectedRepository = {
              schema: "donestate.selected-repository.v1",
              ownerLogin: "operator",
              repository: "owner/repository",
              defaultBranch: "main",
              installationId: 123,
              mode: "pr_only",
              scheduleEnabled: true,
              autoRepair: true,
              requiredCheckNames: ["CI"],
              createdAt: "2026-09-02T00:00:00.000Z",
              updatedAt: "2026-09-02T00:00:00.000Z",
            };
            const finding: MaintenanceFinding = {
              schema: "donestate.maintenance-finding.v1",
              id: "a".repeat(64),
              ownerLogin: "operator",
              repository: "owner/repository",
              source: "github_issue",
              sourceId: "68",
              title: "replacement canary",
              detail: "bounded repair",
              url: "https://github.com/owner/repository/issues/68",
              repairEligible: true,
              state: "OPEN",
              runId: null,
              discoveredAt: "2026-09-02T00:00:00.000Z",
              updatedAt: "2026-09-02T00:00:00.000Z",
            };

            expect(webhookAutoRepairEligible(selected, finding)).toBe(true);
            expect(webhookAutoRepairEligible({ ...selected, mode: "observe" }, finding)).toBe(false);
            expect(webhookAutoRepairEligible({ ...selected, scheduleEnabled: false }, finding)).toBe(false);
            expect(webhookAutoRepairEligible({ ...selected, autoRepair: false }, finding)).toBe(false);
            expect(webhookAutoRepairEligible({ ...selected, installationId: null }, finding)).toBe(false);
            expect(webhookAutoRepairEligible({ ...selected, requiredCheckNames: [] }, finding)).toBe(false);
            expect(webhookAutoRepairEligible(selected, { ...finding, repairEligible: false })).toBe(false);
            expect(webhookAutoRepairEligible(selected, { ...finding, state: "REPAIR_QUEUED", runId: "run" })).toBe(false);
            expect(webhookAutoRepairEligible(selected, { ...finding, repository: "owner/another" })).toBe(false);
          });

          it("retries independent verification only for the awaiting run bound to the completed workflow head", () => {''', "webhook policy regression")
          test_path.write_text(test)

          ledger_path = Path("governance/project-ledger.json")
          ledger = ledger_path.read_text()

          def update_work_item(text: str, item_id: str, next_action: str, wait_condition: str, evidence_ids: list[str]) -> str:
              marker = f'"id":"{item_id}"'
              index = text.find(marker)
              if index < 0:
                  raise SystemExit(f"missing work item {item_id}")
              start = text.rfind("    {", 0, index)
              end = text.find("\n    },", index)
              if start < 0 or end < 0:
                  raise SystemExit(f"cannot bound work item {item_id}")
              end += len("\n    }")
              block = text[start:end]
              block, count = re.subn(r'"nextAction":"(?:\\.|[^"\\])*"', '"nextAction":' + json.dumps(next_action, separators=(",", ":")), block, count=1)
              if count != 1:
                  raise SystemExit(f"nextAction replacement failed for {item_id}")
              block, count = re.subn(r'"waitCondition":"(?:\\.|[^"\\])*"', '"waitCondition":' + json.dumps(wait_condition, separators=(",", ":")), block, count=1)
              if count != 1:
                  raise SystemExit(f"waitCondition replacement failed for {item_id}")
              block, count = re.subn(r'"evidenceIds":\[[^\]]*\]', '"evidenceIds":' + json.dumps(evidence_ids, separators=(",", ":")), block, count=1)
              if count != 1:
                  raise SystemExit(f"evidenceIds replacement failed for {item_id}")
              return text[:start] + block + text[end:]

          ledger = update_work_item(
              ledger,
              "VERIFY-006",
              "Deploy event-driven maintenance dispatch so a valid signed eligible issue webhook starts exactly one PR-only repair immediately, retain the hourly sweep as reconciliation, then edit issue 68 once to trigger the replacement canary and require terminal OpsTruth v2 read-back.",
              "Issue 68 is the only new eligible repair and the repaired Worker 92359483968226509d55dc10bf51bc8a3ef3a920 is deployed with hourly scheduling, but no run, branch, or PR appeared across repeated hourly windows; current webhook code records eligible issue findings while scheduledSweep is the only auto-start path.",
              ["E-015", "E-016", "E-017", "E-018"],
          )
          ledger = update_work_item(
              ledger,
              "VERIFY-004",
              "After event-driven maintenance dispatch is deployed, edit issue 68 to deliver a fresh signed issues webhook, require exactly one new run and governance-clean PR, let exact-head CI settle, then require the workflow webhook to retrigger OpsTruth and DoneState to reach a truthful terminal state.",
              "Replacement issue 68 remains open and eligible but has not started because Cloudflare's configured hourly scheduled event has not produced the expected sweep; event webhook discovery is healthy but does not currently start repairs.",
              ["E-002", "E-003", "E-012", "E-016", "E-017", "E-018"],
          )

          if '"id":"E-018"' in ledger:
              raise SystemExit("E-018 already exists")
          evidence = '''    {
              "id":"E-018","date":"2026-09-02","identity":"Replacement canary isolated scheduled-delivery dependency","situation":"Runtime repair PR 67 merged as 92359483968226509d55dc10bf51bc8a3ef3a920 and deployed as Worker 8dd79328-6681-4fb0-8969-0d8b09f30f8e with the canonical hourly trigger. Replacement issue 68 opened at 09:14 UTC with donestate:repair and remained the only new eligible maintenance issue, but no new run branch or pull request appeared through at least eight expected hourly windows.","verification":"Cloudflare deployment workflow 33612599617 succeeded and its Wrangler output recorded schedule 0 * * * *. GitHub shows issue 68 open and eligible, zero open DoneState pull requests, and no new DoneState run branch after the repaired deployment. Earlier issue 64 required a temporary provider minute trigger before its run was picked up. Source inspection at 92359483968226509d55dc10bf51bc8a3ef3a920 shows signed issue webhooks upsert eligible findings but only scheduledSweep invokes startRepair, making scheduled-event delivery a single point of liveness failure. OpsTruth remains deployed at b25734e9919832854027e8c22b6212b822563f9f / Worker 084fa621-7bbd-4360-b210-a4caeebc8ee0.",
              "accountability":{"owner":"DoneState maintainers","status":"active","nextAction":"Add idempotent event-driven repair dispatch after a valid signed eligible issue webhook, retain hourly scheduledSweep as reconciliation, deploy the repair, then edit issue 68 once to trigger the live replacement canary.","waitCondition":"The replacement canary has not started because the configured hourly provider event is not delivering the required sweep reliably; do not claim live interoperability until issue 68 produces a new terminally verified run.","staleDate":"2026-09-09"},
              "outcome":"The remaining liveness dependency is isolated at the orchestration trigger rather than the verifier contract, GitHub discovery, CI, or PR-only authority layer. Event-driven dispatch restores webhook-first operation while preserving periodic reconciliation and the independent-verifier boundary.","content":"Exact DoneState deployment and schedule evidence, replacement issue state, absence of a new run or PR, source-level webhook-versus-sweep ownership, idempotent dispatch design, and unchanged PR-only verification authority.","measurement":"At least eight expected hourly windows passed with one eligible replacement issue and zero resulting runs or pull requests; the repair adds one event-driven dispatch path, one atomic pre-mutation finding claim, and one policy regression while retaining the hourly fallback."
            }'''
          tail = "\n    }\n  ]\n}"
          pos = ledger.rfind(tail)
          if pos < 0:
              raise SystemExit("cannot locate evidence story tail")
          ledger = ledger[:pos] + "\n    },\n" + evidence + ledger[pos + len("\n    }"):]
          json.loads(ledger)
          ledger_path.write_text(ledger)
          PY
      - name: Install and render governance state
        run: |
          npm ci
          npm run governance:render
      - name: Run root gates
        run: npm run check
      - name: Run hosted Worker gates
        working-directory: apps/mcp-worker
        run: |
          npm ci
          npm run check
      - name: Validate and commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "DoneState Repair"
          git config user.email "bot@donestate.dev"
          git add apps/mcp-worker/src/maintenance-registry.ts
          git add apps/mcp-worker/test/maintenance-registry.test.ts
          git add governance/project-ledger.json
          git add docs/PROJECT-STATE.md
          git rm .github/workflows/apply-event-driven-maintenance-repair.yml
          git diff --cached --check
          git commit -m "Dispatch eligible maintenance repairs from webhooks"
          npm run governance:impact -- origin/main
          git diff --check origin/main...HEAD
          git push origin HEAD:repair/event-driven-maintenance-dispatch

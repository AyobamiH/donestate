name: Validate startProcess receipt launch repair
on:
  push:
    branches: [repair/startprocess-receipt-launch]
permissions:
  contents: write
jobs:
  validate:
    if: github.event.head_commit.message == 'Run startProcess receipt launch repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/startprocess-receipt-launch
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply bounded launch primitive repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('apps/mcp-worker/src/executor.ts'); s=p.read_text()
          old='export const IMPLEMENTATION_DETACHED_LAUNCH_COMMAND = \'nohup /bin/sh "$DONESTATE_RECEIPT_SCRIPT_PATH" > "$DONESTATE_RECEIPT_LOG_PATH" 2>&1 < /dev/null &\';'
          new='export const IMPLEMENTATION_BACKGROUND_LAUNCH_COMMAND = \'/bin/sh "$DONESTATE_RECEIPT_SCRIPT_PATH" > "$DONESTATE_RECEIPT_LOG_PATH" 2>&1\';\nexport function implementationProcessId(runId: string): string { return `donestate-receipt-${runId}`; }'
          assert s.count(old)==1
          s=s.replace(old,new)
          s=s.replace('executionMode: "single_detached_exec_terminal_receipt_alarm_resumable_v3",','executionMode: "single_start_process_terminal_receipt_alarm_resumable_v4",')
          s=s.replace('launchCommandDigest: await digest(IMPLEMENTATION_DETACHED_LAUNCH_COMMAND),','launchCommandDigest: await digest(IMPLEMENTATION_BACKGROUND_LAUNCH_COMMAND),')
          oldblock='''  let launchRaw: Awaited<ReturnType<Sandbox["exec"]>> | null = null;\n  let launchError: string | null = null;\n  try {\n    launchRaw = await sandbox.exec(IMPLEMENTATION_DETACHED_LAUNCH_COMMAND, {\n      cwd: "/workspace/repo",\n      env: {\n        HOME: "/workspace/home",\n        CODEX_API_KEY: openaiApiKey,\n        DONESTATE_OBJECTIVE: implementationPrompt(objective, repositoryGovernanceRequired),\n        DONESTATE_RECEIPT_NONCE: receiptNonce,\n        DONESTATE_RECEIPT_PATH: receiptPath,\n        DONESTATE_RECEIPT_SCHEMA: IMPLEMENTATION_RECEIPT_SCHEMA,\n        DONESTATE_RECEIPT_RUN_ID: objective.runId,\n        DONESTATE_RECEIPT_COMMAND_DIGEST: commandDigest,\n        DONESTATE_RECEIPT_SCRIPT_PATH: receiptScriptPath,\n        DONESTATE_RECEIPT_LOG_PATH: receiptLogPath,\n        DONESTATE_IMPLEMENTATION_TIMEOUT_SECONDS: String(Math.max(1, Math.ceil(objective.maxDurationMs / 1_000))),\n      },\n      timeout: IMPLEMENTATION_LAUNCH_TIMEOUT_MS,\n    });\n    if (!launchRaw.success) {\n      launchError = boundedOutput(redact(launchRaw.stderr || `detached implementation launch exited ${launchRaw.exitCode}`, [openaiApiKey, githubToken]), 4_000).text;\n    }\n  } catch (error) {\n    launchError = boundedOutput(redact(error instanceof Error ? error.message : "implementation detached launch acknowledgement was interrupted", [openaiApiKey, githubToken]), 4_000).text;\n  }\n  checkpoint = {\n    ...checkpoint,\n    launchAcknowledged: launchRaw?.success ?? null,\n    launchError,\n  };'''
          newblock='''  let launchAcknowledged: boolean | null = null;\n  let launchError: string | null = null;\n  try {\n    await sandbox.startProcess(IMPLEMENTATION_BACKGROUND_LAUNCH_COMMAND, {\n      processId: implementationProcessId(objective.runId),\n      cwd: "/workspace/repo",\n      env: {\n        HOME: "/workspace/home",\n        CODEX_API_KEY: openaiApiKey,\n        DONESTATE_OBJECTIVE: implementationPrompt(objective, repositoryGovernanceRequired),\n        DONESTATE_RECEIPT_NONCE: receiptNonce,\n        DONESTATE_RECEIPT_PATH: receiptPath,\n        DONESTATE_RECEIPT_SCHEMA: IMPLEMENTATION_RECEIPT_SCHEMA,\n        DONESTATE_RECEIPT_RUN_ID: objective.runId,\n        DONESTATE_RECEIPT_COMMAND_DIGEST: commandDigest,\n        DONESTATE_RECEIPT_SCRIPT_PATH: receiptScriptPath,\n        DONESTATE_RECEIPT_LOG_PATH: receiptLogPath,\n        DONESTATE_IMPLEMENTATION_TIMEOUT_SECONDS: String(Math.max(1, Math.ceil(objective.maxDurationMs / 1_000))),\n      },\n    });\n    launchAcknowledged = true;\n  } catch (error) {\n    launchError = boundedOutput(redact(error instanceof Error ? error.message : "implementation background launch acknowledgement was interrupted", [openaiApiKey, githubToken]), 4_000).text;\n  }\n  checkpoint = {\n    ...checkpoint,\n    launchAcknowledged,\n    launchError,\n  };'''
          assert s.count(oldblock)==1
          p.write_text(s.replace(oldblock,newblock))

          p=Path('apps/mcp-worker/test/executor.test.ts'); s=p.read_text()
          s=s.replace('IMPLEMENTATION_DETACHED_LAUNCH_COMMAND,','IMPLEMENTATION_BACKGROUND_LAUNCH_COMMAND,')
          s=s.replace('implementationPrompt, implementationReceiptCommand,','implementationProcessId, implementationPrompt, implementationReceiptCommand,')
          old='''    expect(IMPLEMENTATION_DETACHED_LAUNCH_COMMAND).toContain('nohup /bin/sh "$DONESTATE_RECEIPT_SCRIPT_PATH"');\n    expect(IMPLEMENTATION_DETACHED_LAUNCH_COMMAND).toContain('&');\n    expect(IMPLEMENTATION_DETACHED_LAUNCH_COMMAND).not.toContain(CODEX_IMPLEMENT_COMMAND);\n    expect(wrapper).not.toContain("startProcess");'''
          new='''    expect(IMPLEMENTATION_BACKGROUND_LAUNCH_COMMAND).toContain('/bin/sh "$DONESTATE_RECEIPT_SCRIPT_PATH"');\n    expect(IMPLEMENTATION_BACKGROUND_LAUNCH_COMMAND).not.toContain("nohup");\n    expect(IMPLEMENTATION_BACKGROUND_LAUNCH_COMMAND.trim().endsWith("&")).toBe(false);\n    expect(IMPLEMENTATION_BACKGROUND_LAUNCH_COMMAND).not.toContain(CODEX_IMPLEMENT_COMMAND);\n    expect(implementationProcessId(runId)).toBe(`donestate-receipt-${runId}`);\n    expect(wrapper).not.toContain("startProcess");'''
          assert s.count(old)==1
          p.write_text(s.replace(old,new))

          p=Path('governance/project-ledger.json'); s=p.read_text()
          needle='"E-028","E-029","E-030"]'
          assert s.count(needle)==2
          s=s.replace(needle,'"E-028","E-029","E-030","E-031"]')
          s=re.sub(r'("id":"VERIFY-006".*?"nextAction":")[^"]*(","waitCondition":")[^"]*"',r'\1Use Cloudflare Sandbox startProcess only as the single background launch primitive for the existing atomic terminal-receipt wrapper, preserve alarm-sliced receipt reconciliation, and launch one fresh successor canary after reviewed deployment.\2Issue 103 proved alarm slicing remained live for the full deadline but the shell-detach-inside-exec launch never produced a receipt. Completion authority remains the DoneState receipt, not getProcess; no Codex retry is allowed."',s,count=1,flags=re.S)
          s=re.sub(r'("id":"VERIFY-004".*?"nextAction":")[^"]*(","waitCondition":")[^"]*"',r'\1After the startProcess launch-primitive repair is reviewed and deployed, launch one fresh consequence-disabled maintenance canary through receipt reconciliation, PR publication, exact-head CI, OpsTruth v2, and truthful VERIFIED read-back.\2Issue 103 is terminal AMBIGUOUS_EFFECT evidence: one shell-detached launch was admitted and alarm slicing remained healthy, but no terminal receipt appeared before deadline."',s,count=1,flags=re.S)
          evidence='''    ,{\n      "id":"E-031","date":"2026-09-03","identity":"Alarm-sliced canary isolated shell-detach launch loss before terminal receipt","situation":"Issue 103 ran on Worker c39ac211-963b-4835-b157-3fe6df88480a after PR 102 made implementation reconciliation resumable across alarms. Repository materialization succeeded and exactly one short nohup shell-detach launch was admitted in 166 ms.","verification":"RunCoordinator remained live through repeated approximately five-second alarms for the full configured 30-minute implementation window plus receipt grace, proving the coordinator lifetime repair. No donestate.implementation-receipt.v1 terminal receipt ever appeared. The run stopped AMBIGUOUS_EFFECT on implementation effect could not be reconciled from a terminal receipt before the configured deadline; no validation, publication, branch, PR or OpsTruth call followed. The next repair changes only the launch primitive to Sandbox startProcess while keeping the atomic receipt as sole completion authority and never using getProcess as completion proof.",\n      "accountability":{"owner":"DoneState maintainers","status":"active","nextAction":"Use startProcess once with deterministic process identity to launch the existing receipt wrapper, retain receipt-only completion authority and alarm-sliced reconciliation, deploy under review, then launch one fresh canary.","waitCondition":"Issue 103 is terminal evidence and must not be retried or rewritten. Do not add Codex retry or restore process-registry completion authority.","staleDate":"2026-09-10"},\n      "outcome":"The coordinator no longer wedges across the implementation deadline. The remaining failure is isolated to shell background detachment from a short exec control call rather than Codex, OpsTruth, or alarm scheduling.","content":"Exact issue and Worker identity, one admitted shell-detach launch, full alarm-sliced deadline survival, absent terminal receipt, terminal AMBIGUOUS_EFFECT reason, and isolated startProcess launch boundary.","measurement":"One canary, one implementation launch, full configured deadline survived across alarms, zero terminal receipts, zero branches, zero pull requests, zero OpsTruth calls, and one launch-primitive repair defined."\n    }'''
          marker='\n  ]\n}'
          assert s.count(marker)==1
          p.write_text(s.replace(marker,'\n'+evidence+marker))
          PY
      - run: npm run governance:render
      - name: Root validation
        run: |
          npm ci
          npm run check
      - name: Worker validation
        working-directory: apps/mcp-worker
        run: |
          npm ci
          npm run check
      - name: Plugin validation
        run: node scripts/validate-plugin.mjs
      - name: Prepare exact review commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/startprocess-repair.yml
          git config user.name 'Ayobami Haastrup'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Launch receipt wrapper with Sandbox startProcess'
          mapfile -t changed < <(git diff --name-only 419b24a1cd4249c880b520660cb99f65f0b055db...HEAD | sort)
          expected=(apps/mcp-worker/src/executor.ts apps/mcp-worker/test/executor.test.ts docs/PROJECT-STATE.md governance/project-ledger.json)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${changed[*]}" = "${expected_sorted[*]}"
      - name: Governance impact
        run: npm run governance:impact -- 419b24a1cd4249c880b520660cb99f65f0b055db
      - run: git push origin HEAD:repair/startprocess-receipt-launch

name: Finalize recovered verifier contract

on:
  push:
    branches:
      - repair/versioned-verification-contract-59

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Stage verifier contract finalizer'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final contract hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}")
              file.write_text(text.replace(old, new, 1))

          # New RunCoordinator rows are never historical compatibility rows.
          replace_once(
              "apps/mcp-worker/src/coordinator.ts",
              '''  async create(objective: HostedObjective, githubToken: string): Promise<PublicRunRecord> {\n    validateHostedObjective(objective);\n''',
              '''  async create(objective: HostedObjective, githubToken: string): Promise<PublicRunRecord> {\n    if (objective.verificationContractVersion !== VERIFICATION_CONTRACT_VERSION) {\n      throw new Error("new hosted objectives require the versioned verification response contract");\n    }\n    validateHostedObjective(objective);\n''',
          )

          # Reject extra/unsigned envelope material on the direct OpsTruth lane before casting.
          opstruth = Path("apps/mcp-worker/src/opstruth.ts")
          text = opstruth.read_text()
          anchor = '''} from "./types";\n\nasync function callOpsTruth'''
          helper = '''} from "./types";\n\nfunction isRecord(value: unknown): value is Record<string, unknown> {\n  return Boolean(value) && typeof value === "object" && !Array.isArray(value);\n}\n\nfunction hasExactKeys(value: Record<string, unknown>, expected: readonly string[]): boolean {\n  const actual = Object.keys(value).sort();\n  const required = [...expected].sort();\n  return actual.length === required.length && actual.every((key, index) => key === required[index]);\n}\n\nfunction assertStrictVerificationEnvelope(structured: Record<string, unknown>): void {\n  if (!hasExactKeys(structured, ["contractVersion", "report", "attestation"])) {\n    throw new Error("OpsTruth response did not contain a strict verification contract bundle");\n  }\n  const attestation = structured.attestation;\n  if (!isRecord(attestation) || !hasExactKeys(attestation, [\n    "schema", "runId", "executionSnapshotDigest", "verificationNonce", "handoffDigest",\n    "verificationReportDigest", "decision", "issuedBy", "issuedAt", "evidenceRefs", "signature",\n  ])) {\n    throw new Error("OpsTruth response did not contain a strict verification contract bundle");\n  }\n  const signature = attestation.signature;\n  if (!isRecord(signature) || !hasExactKeys(signature, [\n    "algorithm", "publicKeyPem", "signerFingerprint", "signatureBase64",\n  ])) {\n    throw new Error("OpsTruth response did not contain a strict verification contract bundle");\n  }\n}\n\nasync function callOpsTruth'''
          if anchor not in text:
              raise SystemExit("expected opstruth helper anchor missing")
          text = text.replace(anchor, helper, 1)
          old = '''  const structured = await callOpsTruth(endpoint, handoff);\n  if (structured.contractVersion !== VERIFICATION_CONTRACT_VERSION\n    || !structured.report || typeof structured.report !== "object" || Array.isArray(structured.report)\n    || !structured.attestation || typeof structured.attestation !== "object" || Array.isArray(structured.attestation)) {\n    throw new Error("OpsTruth response did not contain the supported verification contract bundle");\n  }\n'''
          new = '''  const structured = await callOpsTruth(endpoint, handoff);\n  assertStrictVerificationEnvelope(structured);\n  if (structured.contractVersion !== VERIFICATION_CONTRACT_VERSION\n    || !structured.report || typeof structured.report !== "object" || Array.isArray(structured.report)) {\n    throw new Error("OpsTruth response did not contain the supported verification contract bundle");\n  }\n'''
          if old not in text:
              raise SystemExit("expected opstruth response anchor missing")
          opstruth.write_text(text.replace(old, new, 1))

          # Make the MCP parser strict at the nested v2 signature boundary too.
          server = Path("apps/mcp-worker/src/server.ts")
          text = server.read_text()
          start = text.index('const attestationV2Schema = z.object({')
          end = text.index('const attestationSchema =', start)
          block = text[start:end]
          sig_old = '''  signature: z.object({\n    algorithm: z.literal("ed25519"),\n    publicKeyPem: z.string().min(1).max(10_000),\n    signerFingerprint: z.string().regex(/^[a-f0-9]{64}$/),\n    signatureBase64: z.string().min(1).max(10_000),\n  }),\n});\n'''
          sig_new = '''  signature: z.object({\n    algorithm: z.literal("ed25519"),\n    publicKeyPem: z.string().min(1).max(10_000),\n    signerFingerprint: z.string().regex(/^[a-f0-9]{64}$/),\n    signatureBase64: z.string().min(1).max(10_000),\n  }).strict(),\n}).strict();\n'''
          if sig_old not in block:
              raise SystemExit("expected v2 attestation schema anchor missing")
          server.write_text(text[:start] + block.replace(sig_old, sig_new, 1) + text[end:])

          # Coordinator tests: all new rows are v2; the legacy test explicitly simulates a persisted pre-contract row.
          replace_once(
              "apps/mcp-worker/test/coordinator.test.ts",
              'import type { HostedObjective, PublicRunRecord, VerificationAttestationV1, VerificationAttestationV2 } from "../src/types";\n',
              'import { VERIFICATION_CONTRACT_VERSION, type HostedObjective, type PublicRunRecord, type VerificationAttestationV1, type VerificationAttestationV2 } from "../src/types";\n',
          )
          replace_once(
              "apps/mcp-worker/test/coordinator.test.ts",
              '''    validationProfile: "none",\n    publication: "branch",\n    trustedVerifierFingerprints: [],\n''',
              '''    validationProfile: "none",\n    publication: "branch",\n    verificationContractVersion: VERIFICATION_CONTRACT_VERSION,\n    trustedVerifierFingerprints: [],\n''',
          )
          replace_once(
              "apps/mcp-worker/test/coordinator.test.ts",
              '''describe("RunCoordinator", () => {\n  it("persists a received run without exposing its GitHub token", async () => {\n''',
              '''describe("RunCoordinator", () => {\n  it("rejects a new objective that omits the versioned verification contract", async () => {\n    const runId = "77777777-7777-4777-8777-777777777777";\n    const candidate = objective(runId);\n    delete candidate.verificationContractVersion;\n    const stub = env.RUN_COORDINATOR.getByName(runId);\n    await expect(stub.create(candidate, "github-test-token"))\n      .rejects.toThrow("new hosted objectives require the versioned verification response contract");\n  });\n\n  it("persists a received run without exposing its GitHub token", async () => {\n''',
          )
          replace_once(
              "apps/mcp-worker/test/coordinator.test.ts",
              '''    await stub.create(configuredObjective, "github-test-token");\n    await runInDurableObject(stub, async (_instance: RunCoordinator, state) => {\n      state.storage.sql.exec(\n        "UPDATE run SET state = 'AWAITING_VERIFICATION', verification_snapshot_digest = ? WHERE id = ?",\n        snapshotDigest,\n        runId,\n      );\n    });\n''',
              '''    await stub.create(configuredObjective, "github-test-token");\n    await runInDurableObject(stub, async (_instance: RunCoordinator, state) => {\n      const historicalObjective = { ...configuredObjective };\n      delete historicalObjective.verificationContractVersion;\n      state.storage.sql.exec(\n        "UPDATE run SET objective_json = ?, state = 'AWAITING_VERIFICATION', verification_snapshot_digest = ? WHERE id = ?",\n        canonicalJson(historicalObjective),\n        snapshotDigest,\n        runId,\n      );\n    });\n''',
          )

          # The bridge must reject strict-envelope violations before the response can reach state transition logic.
          replace_once(
              "apps/mcp-worker/test/opstruth.test.ts",
              '''  it("rejects credentialed or non-HTTPS endpoints before network access", async () => {\n''',
              '''  it("rejects extra fields in the versioned response, attestation, or signature", async () => {\n    const report = { schema: "opstruth.donestate-verification-report.v1", runId: handoff.runId };\n    const payloads = [\n      { contractVersion: VERIFICATION_CONTRACT_VERSION, report, attestation, unsupported: true },\n      { contractVersion: VERIFICATION_CONTRACT_VERSION, report, attestation: { ...attestation, unsupported: true } },\n      {\n        contractVersion: VERIFICATION_CONTRACT_VERSION,\n        report,\n        attestation: { ...attestation, signature: { ...attestation.signature, unsupported: true } },\n      },\n    ];\n    const request = vi.fn();\n    for (const structuredContent of payloads) {\n      request.mockResolvedValueOnce(Response.json({\n        jsonrpc: "2.0",\n        id: handoff.runId,\n        result: { structuredContent },\n      }));\n    }\n    vi.stubGlobal("fetch", request);\n\n    for (const _payload of payloads) {\n      await expect(requestOpsTruthVerification("https://opstruth.example/mcp", handoff))\n        .rejects.toThrow("strict verification contract bundle");\n    }\n    expect(request).toHaveBeenCalledTimes(payloads.length);\n  });\n\n  it("rejects credentialed or non-HTTPS endpoints before network access", async () => {\n''',
          )

          # Extend the published negative corpus with strict-envelope mutations.
          negative_path = Path("schemas/vectors/verification-contract-v2-negative.json")
          negative = json.loads(negative_path.read_text())
          existing = {item.get("id") for item in negative.get("mutations", [])}
          additions = [
              {
                  "id": "extra_response_field",
                  "operation": "add",
                  "path": "/response/unsupported",
                  "value": True,
                  "expected": "strict response envelope rejects additional properties",
              },
              {
                  "id": "extra_attestation_field",
                  "operation": "add",
                  "path": "/response/attestation/unsupported",
                  "value": True,
                  "expected": "strict attestation envelope rejects additional properties",
              },
              {
                  "id": "extra_signature_field",
                  "operation": "add",
                  "path": "/response/attestation/signature/unsupported",
                  "value": True,
                  "expected": "strict signature envelope rejects additional properties",
              },
          ]
          negative["mutations"].extend(item for item in additions if item["id"] not in existing)
          negative_path.write_text(json.dumps(negative, indent=2) + "\n")

          # Consume the strict-envelope mutations against the published response schema, not just by counting them.
          schema_test = Path("src/test/schema.test.ts")
          text = schema_test.read_text()
          anchor = '''async function json(file: string): Promise<unknown> {\n  return JSON.parse(await readFile(path.resolve(file), "utf8"));\n}\n'''
          helper = '''async function json(file: string): Promise<unknown> {\n  return JSON.parse(await readFile(path.resolve(file), "utf8"));\n}\n\nfunction mutateJsonPointer(root: unknown, pointer: string, value: unknown): unknown {\n  const copy = structuredClone(root) as Record<string, unknown>;\n  const parts = pointer.split("/").slice(1).map((part) => part.replace(/~1/g, "/").replace(/~0/g, "~"));\n  assert.ok(parts.length > 0);\n  let cursor: Record<string, unknown> = copy;\n  for (const part of parts.slice(0, -1)) {\n    const next = cursor[part];\n    assert.ok(next && typeof next === "object" && !Array.isArray(next));\n    cursor = next as Record<string, unknown>;\n  }\n  cursor[parts.at(-1)!] = value;\n  return copy;\n}\n'''
          if anchor not in text:
              raise SystemExit("expected schema helper anchor missing")
          text = text.replace(anchor, helper, 1)
          old = '''  const negative = await json("schemas/vectors/verification-contract-v2-negative.json") as { mutations?: unknown[] };\n  assert.equal(Array.isArray(negative.mutations) && negative.mutations.length >= 8, true);\n\n});\n'''
          new = '''  const negative = await json("schemas/vectors/verification-contract-v2-negative.json") as {\n    mutations?: Array<{ id: string; operation: string; path: string; value?: unknown; expected: string }>;\n  };\n  assert.equal(Array.isArray(negative.mutations) && negative.mutations.length >= 11, true);\n  const mutations = new Map(negative.mutations!.map((mutation) => [mutation.id, mutation]));\n  for (const id of [\n    "unsupported_contract", "missing_requirement", "decision_mismatch", "altered_handoff",\n    "future_observation", "stale_observation", "revoked_signer", "replayed_nonce",\n    "extra_response_field", "extra_attestation_field", "extra_signature_field",\n  ]) {\n    assert.equal(mutations.has(id), true, `missing negative verification mutation ${id}`);\n  }\n\n  const verifiedVector = await json("schemas/vectors/verification-contract-v2-verified.json") as { response: unknown };\n  for (const id of ["unsupported_contract", "extra_response_field", "extra_attestation_field", "extra_signature_field"]) {\n    const mutation = mutations.get(id)!;\n    assert.equal(["replace", "add"].includes(mutation.operation), true);\n    const mutated = mutateJsonPointer(verifiedVector, mutation.path, mutation.value) as { response: unknown };\n    assert.equal(validateResponseV2(mutated.response), false, `${id} must fail the published response schema`);\n  }\n\n});\n'''
          if old not in text:
              raise SystemExit("expected negative vector test anchor missing")
          schema_test.write_text(text.replace(old, new, 1))

          # Clarify that strict transport/envelope rejection is part of the review candidate.
          doc = Path("docs/VERIFICATION-CONTRACT.md")
          text = doc.read_text()
          old = '''1. The contract, report, handoff, and attestation versions are supported.\n2. Run ID, handoff digest, verification nonce, execution snapshot, repository, base SHA, expected head SHA, and exact observed head agree.\n'''
          new = '''1. The contract, report, handoff, and attestation versions are supported, and the response/attestation/signature envelopes contain no unsupported fields.\n2. Run ID, handoff digest, verification nonce, execution snapshot, repository, base SHA, expected head SHA, and exact observed head agree. The handoff digest also seals the branch/publication/PR identity carried by handoff v2.\n'''
          if old not in text:
              raise SystemExit("expected verification contract doc anchor missing")
          doc.write_text(text.replace(old, new, 1))
          PY

          rm -f .github/workflows/finalize-verifier-contract.yml
          git diff --check

      - name: Install and validate root
        run: |
          npm ci --ignore-scripts
          npm run check

      - name: Install and validate hosted Worker
        working-directory: apps/mcp-worker
        run: |
          npm ci --ignore-scripts
          npm run check
          node scripts/validate-plugin.mjs
          rm -f worker-configuration.d.ts

      - name: Commit exact review candidate
        shell: bash
        run: |
          git config user.name "Ayobami Haastrup"
          git config user.email "47716486+AyobamiH@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden recovered verifier contract boundary"
          npm run governance:impact -- origin/main
          git diff --check origin/main...HEAD
          git push origin HEAD:repair/versioned-verification-contract-59

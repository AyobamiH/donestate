name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: ${{ matrix.node-version == 22 }}
        env:
          GOVERNANCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run governance:impact -- "$GOVERNANCE_BASE_SHA"

  hosted-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mcp-worker/package-lock.json
      - run: npm ci
        working-directory: apps/mcp-worker
      - name: Report Worker dependency advisories
        working-directory: apps/mcp-worker
        shell: bash
        run: |
          set +e
          npm audit --json > /tmp/worker-audit.json
          audit_status=$?
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("/tmp/worker-audit.json", "utf8"));
          const rows = Object.entries(report.vulnerabilities ?? {}).map(([name, value]) => ({
            name,
            severity: value.severity,
            isDirect: value.isDirect,
            range: value.range,
            fixAvailable: value.fixAvailable,
            via: (value.via ?? []).map((item) => typeof item === "string" ? item : {
              source: item.source,
              name: item.name,
              severity: item.severity,
              title: item.title,
              range: item.range,
              url: item.url,
            }),
          }));
          console.log(JSON.stringify({ metadata: report.metadata, vulnerabilities: rows }, null, 2));
          NODE
          exit 0
      - run: npm run check
        working-directory: apps/mcp-worker
      - run: node scripts/validate-plugin.mjs

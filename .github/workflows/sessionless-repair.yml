name: Validate Sandbox sessionless execution repair

on:
  push:
    branches:
      - repair/sandbox-sessionless-execution

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Run sessionless repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/sandbox-sessionless-execution
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Apply bounded sessionless execution correction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          executor = Path('apps/mcp-worker/src/executor.ts')
          text = executor.read_text()
          old = 'export const SANDBOX_RUNTIME_OPTIONS = { sleepAfter: "15m", keepAlive: true } as const;'
          new = 'export const SANDBOX_RUNTIME_OPTIONS = { sleepAfter: "15m", keepAlive: true, enableDefaultSession: false } as const;'
          if text.count(old) != 1:
              raise SystemExit('executor Sandbox options context drifted')
          executor.write_text(text.replace(old, new))

          test = Path('apps/mcp-worker/test/executor.test.ts')
          text = test.read_text()
          old = '''  it("keeps long-running implementation sandboxes alive until deterministic cleanup", () => {\n    expect(SANDBOX_RUNTIME_OPTIONS).toEqual({ sleepAfter: "15m", keepAlive: true });\n  });'''
          new = '''  it("keeps long-running implementation sandboxes alive without a persistent default session", () => {\n    expect(SANDBOX_RUNTIME_OPTIONS).toEqual({ sleepAfter: "15m", keepAlive: true, enableDefaultSession: false });\n  });'''
          if text.count(old) != 1:
              raise SystemExit('executor test context drifted')
          test.write_text(text.replace(old, new))

          ledger = Path('governance/project-ledger.json')
          text = ledger.read_text()
          replacements = [
              (
                  '"nextAction":"Keep the aligned 0.12.9 RPC Sandbox runtime alive for the bounded active execution window using the SDK keepAlive lifecycle option, preserve the existing deterministic destroy cleanup, keep Codex 0.150.1, command, timeout and retry semantics unchanged, deploy under normal review, then launch one fresh canary.","waitCondition":"Issue 83 proved RPC transport removed the HTTP 500 signature but exposed the deeper lifecycle failure: on Worker 2e70de5c-cc10-4bc4-858b-42cb6ba37c35, clone succeeded under RPC and the unchanged Codex command was interrupted after 69498 ms because the Sandbox runtime connection was closing. DoneState passes a 30-minute implementation timeout, so this is not the configured command timeout. The executor creates Sandboxes with sleepAfter only and never enables keepAlive, while Cloudflare documents keepAlive for long-running builds/processes and the executor already destroys its active Sandbox in finally.",',
                  '"nextAction":"Disable the Cloudflare Sandbox default session for DoneState implicit executor operations while preserving aligned 0.12.9, RPC transport, keepAlive, Codex 0.150.1, command, timeout and retry semantics; deploy under normal review and launch one fresh canary.","waitCondition":"Issue 85 proved keepAlive did not remove the RPC interruption: exactly one run d295908a-633e-4201-8465-881dd8bffa2d used Worker a645a23e-f5cf-47b6-8d7b-8c58fb78159a, clone attempt 2 succeeded, then the unchanged Codex command was interrupted after 23486 ms because the runtime connection was closing. Cloudflare Sandbox 0.12.9 still defaults enableDefaultSession to true unless explicitly disabled, current guidance recommends sessionless implicit execution, and upstream issues 864/865 document the same session_disposed family when a cached default session outlives its container generation. The 0.12.9 changelog does not include that generation fix.",'
              ),
              (
                  '"nextAction":"After the bounded Sandbox keepAlive lifecycle correction is reviewed and deployed on the aligned 0.12.9 RPC stack, run one fresh consequence-disabled maintenance canary through Codex implementation, publication, exact-head CI, OpsTruth v2 response, and terminal DoneState read-back.","waitCondition":"Issue 83 failed before publication because the RPC Sandbox runtime connection closed during the unchanged Codex command. The next canary must wait for the isolated keepAlive lifecycle correction; Codex version, command, timeout, retry behavior, RPC transport and verifier must remain unchanged so the result is attributable.",',
                  '"nextAction":"After sessionless implicit Sandbox execution is reviewed and deployed on the aligned 0.12.9 RPC + keepAlive stack, run one fresh consequence-disabled maintenance canary through Codex implementation, publication, exact-head CI, OpsTruth v2 response, and terminal DoneState read-back.","waitCondition":"Issue 85 failed before publication even with keepAlive enabled. The next canary must wait for the isolated enableDefaultSession=false correction; Sandbox version, RPC transport, keepAlive, Codex version, command, timeout, retry behavior and verifier must remain unchanged so the result is attributable.",'
              ),
              ('"E-023","E-024","E-025"]', '"E-023","E-024","E-025","E-026"]'),
          ]
          for old, new in replacements:
              count = text.count(old)
              expected = 2 if old == '"E-023","E-024","E-025"]' else 1
              if count != expected:
                  raise SystemExit(f'ledger context drifted: expected {expected}, found {count}')
              text = text.replace(old, new)

          evidence = '''    ,{\n      "id":"E-026","date":"2026-09-03","identity":"keepAlive canary ruled out inactivity alone and isolated persistent default-session risk","situation":"PR 84 merged as 71a1188a0313ff29ddd1cb265acd53f8edc6922d and deployed Worker a645a23e-f5cf-47b6-8d7b-8c58fb78159a with Sandbox 0.12.9, RPC transport and keepAlive true while Codex 0.150.1, command, timeout and retry semantics remained unchanged. Fresh issue 85 produced exactly one finding and one run d295908a-633e-4201-8465-881dd8bffa2d.","verification":"Clone attempt 1 failed with exit 128 and bounded fresh-sandbox attempt 2 succeeded. Production then ran the unchanged Codex implementation command through RPC with keepAlive enabled, but Sandbox.exec failed after 23486 ms with Sandbox operation commands.execute was interrupted while the runtime connection was closing. No HTTP 500 occurred, no validation or publication began, no branch or PR was created and OpsTruth was never invoked. Cloudflare Sandbox 0.12.9 source defaults enableDefaultSession to true unless callers explicitly disable it; current Cloudflare migration guidance recommends enableDefaultSession false for implicit operations. Upstream sandbox-sdk issues 864/865 reproduce the same OperationInterruptedError/session_disposed family and identify stale default-session identity across container generations as a defect. The 0.12.9 changelog contains no release note for that generation repair.",\n      "accountability":{"owner":"DoneState maintainers","status":"active","nextAction":"Set enableDefaultSession false in the existing bounded Sandbox runtime options, preserve 0.12.9, RPC, keepAlive and deterministic destroy cleanup, keep Codex and retry semantics unchanged, deploy under normal review, then launch a fresh successor canary.","waitCondition":"Issue 85 is terminal pre-publication evidence and must not be retried, reopened, reset or rewritten. Do not add Codex retries or change transport/version/timeouts in the same experiment.","staleDate":"2026-09-10"},\n      "outcome":"keepAlive is retained as valid lifecycle hardening but is not sufficient. The next isolated layer removes reliance on the persistent default session implicated by current Cloudflare guidance and upstream session-generation failure evidence.","content":"Exact issue/finding/run identities, deployed Worker and Sandbox subjects, clone-attempt outcomes, RPC+keepAlive Codex interruption at 23486 ms, absence of publication/verifier activity, 0.12.9 default-session behavior and upstream session_disposed evidence.","measurement":"One fresh canary, one finding, one run, two clone attempts with one successful materialization, one RPC Codex interruption at 23486 ms, zero HTTP 500s, zero branches, zero PRs, zero OpsTruth calls and one isolated default-session correction defined."\n    }'''
          marker = '\n  ]\n}'
          if text.count(marker) != 1:
              raise SystemExit('ledger evidence tail drifted')
          text = text.replace(marker, '\n' + evidence + marker)
          ledger.write_text(text)
          PY
      - name: Render governance state
        run: npm run governance:render
      - name: Root validation
        run: |
          npm ci
          npm run check
      - name: Hosted Worker validation
        working-directory: apps/mcp-worker
        run: |
          npm ci
          npm run check
      - name: Plugin validation
        run: node scripts/validate-plugin.mjs
      - name: Prepare exact review commit
        env:
          BASE_SHA: 71a1188a0313ff29ddd1cb265acd53f8edc6922d
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/sessionless-repair.yml
          git config user.name 'Ayobami Haastrup'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add -A
          git commit -m 'Disable persistent Sandbox default session'
          mapfile -t changed < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          printf '%s\n' "${changed[@]}"
          expected=(
            apps/mcp-worker/src/executor.ts
            apps/mcp-worker/test/executor.test.ts
            docs/PROJECT-STATE.md
            governance/project-ledger.json
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [ "${changed[*]}" != "${expected_sorted[*]}" ]; then
            echo 'unexpected net review diff' >&2
            exit 1
          fi
      - name: Governance impact on exact net commit
        env:
          BASE_SHA: 71a1188a0313ff29ddd1cb265acd53f8edc6922d
        run: npm run governance:impact -- "$BASE_SHA"
      - name: Push exact review commit
        run: git push origin HEAD:repair/sandbox-sessionless-execution

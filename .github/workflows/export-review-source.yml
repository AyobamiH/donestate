name: Apply recovered verification contract

on:
  push:
    branches:
      - repair/versioned-verification-contract-59

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Install recovered contract applier'
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore recovered contract implementation
        shell: bash
        run: |
          cat .recovery/contract-overlay.* > "$RUNNER_TEMP/overlay.b64"
          base64 -d "$RUNNER_TEMP/overlay.b64" > "$RUNNER_TEMP/overlay.tgz"
          echo "d85be2bc192cb6d2ef03bdabf9b8fa28c8f0b0989fc9a70275c1ff3160e6e2cf  $RUNNER_TEMP/overlay.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/overlay.tgz"
      - name: Install and validate root
        run: |
          npm ci --ignore-scripts
          npm run check
      - name: Install and validate hosted Worker
        working-directory: apps/mcp-worker
        run: |
          npm ci --ignore-scripts
          npm run check
          rm -f worker-configuration.d.ts
      - name: Commit exact recovered files
        shell: bash
        run: |
          git config user.name "Ayobami Haastrup"
          git config user.email "47716486+AyobamiH@users.noreply.github.com"
          git add -- \
            apps/mcp-worker/src/coordinator.ts apps/mcp-worker/src/crypto.ts \
            apps/mcp-worker/src/environment.ts apps/mcp-worker/src/maintenance-registry.ts \
            apps/mcp-worker/src/opstruth.ts apps/mcp-worker/src/server.ts \
            apps/mcp-worker/src/types.ts apps/mcp-worker/src/validation.ts \
            apps/mcp-worker/src/verification-contract.ts apps/mcp-worker/test/coordinator.test.ts \
            apps/mcp-worker/test/opstruth.test.ts apps/mcp-worker/test/verification-contract.test.ts \
            apps/mcp-worker/test/verification-fixtures.ts contracts/donestate-opstruth-verification.v2.json \
            docs/CURRENT-STATUS.md docs/PROJECT-STATE.md docs/VERIFICATION-CONTRACT.md \
            governance/project-ledger.json package.json schemas/verification-report-v1.schema.json \
            schemas/verification-response-v2.schema.json schemas/vectors/verification-contract-v2-verified.json \
            schemas/vectors/verification-contract-v2-failed.json schemas/vectors/verification-contract-v2-uncertain.json \
            schemas/vectors/verification-contract-v2-negative.json src/store.ts src/test/controller.test.ts \
            src/test/schema.test.ts src/verification.ts
          git diff --cached --check
          git commit -m "Enforce versioned DoneState OpsTruth verification contract"
          git push origin HEAD:repair/versioned-verification-contract-59

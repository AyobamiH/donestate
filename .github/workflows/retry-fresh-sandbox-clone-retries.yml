name: Retry fresh-sandbox clone repair

on:
  push:
    branches:
      - repair/fresh-sandbox-clone-retries

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Retry fresh-sandbox clone repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply bounded repair with current evidence id
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/E-021/E-022/g' .github/scripts/apply-fresh-sandbox-clone-retries.py
          python3 .github/scripts/apply-fresh-sandbox-clone-retries.py
      - name: Install and render governance state
        run: |
          npm ci
          npm run governance:render
      - name: Run root gates
        run: npm run check
      - name: Run hosted Worker gates
        working-directory: apps/mcp-worker
        run: |
          npm ci
          npm run check
      - name: Validate and commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "DoneState Repair"
          git config user.email "bot@donestate.dev"
          git add apps/mcp-worker/src/executor.ts
          git add apps/mcp-worker/test/executor.test.ts
          git add governance/project-ledger.json
          git add docs/PROJECT-STATE.md
          git rm .github/scripts/apply-fresh-sandbox-clone-retries.py
          git rm .github/workflows/apply-fresh-sandbox-clone-retries.yml
          git rm .github/workflows/retry-fresh-sandbox-clone-retries.yml
          git diff --cached --check
          git commit -m "Retry public clone in fresh sandboxes"
          npm run governance:impact -- origin/main
          git diff --check origin/main...HEAD
          git push origin HEAD:repair/fresh-sandbox-clone-retries

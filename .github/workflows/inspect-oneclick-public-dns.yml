name: Inspect One Click Public DNS

on:
  push:
    branches:
      - ops/inspect-oneclick-pages
    paths:
      - ".github/workflows/inspect-oneclick-public-dns.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read public DNS and HTTP edge identity
        shell: bash
        run: |
          set -euo pipefail
          DOMAIN="oneclickwebsitedesignfactory.com"
          echo "=== NS ==="
          dig +short NS "$DOMAIN" || true
          echo "=== SOA ==="
          dig +short SOA "$DOMAIN" || true
          echo "=== A ==="
          dig +short A "$DOMAIN" || true
          echo "=== AAAA ==="
          dig +short AAAA "$DOMAIN" || true
          echo "=== CNAME apex ==="
          dig +short CNAME "$DOMAIN" || true
          echo "=== WWW ==="
          dig +short CNAME "www.$DOMAIN" || true
          dig +short A "www.$DOMAIN" || true
          echo "=== HTTP headers ==="
          curl --silent --show-error --head --location --max-time 20 "https://$DOMAIN/" | sed -n '1,40p'

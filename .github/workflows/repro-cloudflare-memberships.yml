name: Cloudflare memberships 10001 reproduction

on:
  push:
    branches:
      - "repro/cloudflare-memberships-10001"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify secret is present
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "cloudflare_api_token_present=yes"

      - name: Probe Cloudflare token type and memberships endpoint
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_ACCOUNT_ID || true
          probe() {
            label="$1"
            url="$2"
            tmp="$(mktemp)"
            status="$(curl --silent --show-error --output "$tmp" --write-out "%{http_code}" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$url")"
            success="$(jq -r '.success // "null"' "$tmp")"
            codes="$(jq -c '[.errors[]?.code]' "$tmp")"
            messages="$(jq -c '[.errors[]?.message]' "$tmp")"
            echo "${label}_http=${status}"
            echo "${label}_success=${success}"
            echo "${label}_error_codes=${codes}"
            echo "${label}_error_messages=${messages}"
            rm -f "$tmp"
          }
          probe "user_token_verify" "https://api.cloudflare.com/client/v4/user/tokens/verify"
          probe "memberships" "https://api.cloudflare.com/client/v4/memberships"

      - name: Exercise latest Wrangler automatic account discovery
        shell: bash
        run: |
          set -euo pipefail
          unset CLOUDFLARE_ACCOUNT_ID || true
          npx --yes wrangler@latest --version
          set +e
          output="$(npx --yes wrangler@latest whoami --json 2>&1)"
          status=$?
          set -e
          echo "wrangler_whoami_exit=$status"
          printf '%s\n' "$output" | grep -Eo '/memberships|/accounts|\[code: [0-9]+\]|code: [0-9]+' | sort -u || true

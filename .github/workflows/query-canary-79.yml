name: Diagnose terminal-receipt canary 98

on:
  push:
    branches:
      - ops/diagnose-canary-79

permissions:
  contents: read

jobs:
  query:
    if: github.event.head_commit.message == 'Diagnose terminal-receipt canary 98'
    runs-on: ubuntu-latest
    steps:
      - name: Query bounded production signals
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          query_logs() {
            local needle="$1"
            local slug request response
            slug=$(printf '%s' "$needle" | tr ' /:!' '_____' | tr -cd '[:alnum:]_-')
            request="$RUNNER_TEMP/request-$slug.json"
            response="$RUNNER_TEMP/response-$slug.json"
            jq -n --arg needle "$needle" '{
              queryId: "donestate-canary-98-terminal-receipt",
              timeframe: {from: 1788421440000, to: 1788426000000},
              view: "events",
              limit: 500,
              parameters: {
                datasets: [],
                filterCombination: "and",
                filters: [{key: "$metadata.service", operation: "eq", type: "string", value: "donestate-mcp"}],
                limit: 300,
                needle: {value: $needle, isRegex: false, matchCase: false}
              }
            }' > "$request"
            curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @"$request" > "$response"
            echo "=== $needle ==="
            jq '{count: .result.events.count, events: [(.result.events.events // [])[] | {
              timestamp,
              metadata: ((.["$metadata"] // {}) | {message, error, level, origin, service}),
              workers: ((.["$workers"] // {}) | {eventType, outcome, entrypoint, durableObjectId, scriptVersion, traceId})
            }]}' "$response"
          }
          for needle in \
            "maintenance repair queued from issue webhook" \
            "git clone --no-tags" \
            "Using rpc transport" \
            "codex --ask-for-approval" \
            "implementation receipt" \
            "donestate.implementation-receipt.v1" \
            "runtime connection was closing" \
            "DoneState run stopped" \
            "validation_started" \
            "publication_started" \
            "git push origin" \
            "automatic independent verification did not complete" \
            "maintenance verification retry completed" \
            "VERIFIED"; do
            query_logs "$needle"
          done

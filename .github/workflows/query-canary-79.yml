name: Inspect alarm-sliced canary 103 raw runtime events

on:
  push:
    branches:
      - ops/diagnose-canary-79

permissions:
  contents: read

jobs:
  query:
    if: github.event.head_commit.message == 'Inspect alarm-sliced canary 103 raw runtime events'
    runs-on: ubuntu-latest
    steps:
      - name: Query raw bounded runtime events
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          query_events() {
            local name="$1"
            local filter_key="$2"
            local filter_value="$3"
            local request="$RUNNER_TEMP/request-$name.json"
            local response="$RUNNER_TEMP/response-$name.json"
            jq -n --arg key "$filter_key" --arg value "$filter_value" --arg qid "donestate-canary-103-$name" '{
              queryId: $qid,
              timeframe: {from: 1788440040000, to: 1788441600000},
              view: "events",
              limit: 1000,
              parameters: {
                datasets: [],
                filterCombination: "and",
                filters: [
                  {key: "$metadata.service", operation: "eq", type: "string", value: "donestate-mcp"},
                  {key: $key, operation: "eq", type: "string", value: $value}
                ],
                limit: 500
              }
            }' > "$request"
            curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @"$request" > "$response"
            echo "=== $name ==="
            jq '{count: .result.events.count, events: [(.result.events.events // [])[] | {
              timestamp,
              metadata: ((.["$metadata"] // {}) | {message, error, level, origin, service}),
              workers: ((.["$workers"] // {}) | {eventType, outcome, entrypoint, durableObjectId, scriptVersion, traceId})
            }]}' "$response"
          }
          query_events coordinator '$workers.entrypoint' 'RunCoordinator'
          query_events sandbox '$workers.durableObjectId' '68cab69aaa11d8b8727dd4eeea876c9dcabe2ca367943627bb0cde9e89f6653e'

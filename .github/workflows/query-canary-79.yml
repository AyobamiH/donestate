name: Trace canary 85 raw run identities

on:
  push:
    branches:
      - ops/diagnose-canary-79

permissions:
  contents: read

jobs:
  query:
    if: github.event.head_commit.message == 'Trace canary 85 raw run identities'
    runs-on: ubuntu-latest
    steps:
      - name: Query safe structured production identities
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          query_raw() {
            local needle="$1"
            local slug request response
            slug=$(printf '%s' "$needle" | tr ' /:!' '_____' | tr -cd '[:alnum:]_-')
            request="$RUNNER_TEMP/request-$slug.json"
            response="$RUNNER_TEMP/response-$slug.json"
            jq -n --arg needle "$needle" '{
              queryId: "donestate-canary-85-raw-identities",
              timeframe: {from: 1788407730000, to: 1788409800000},
              view: "events",
              limit: 100,
              parameters: {
                datasets: [],
                filterCombination: "and",
                filters: [{key: "$metadata.service", operation: "eq", type: "string", value: "donestate-mcp"}],
                limit: 50,
                needle: {value: $needle, isRegex: false, matchCase: false}
              }
            }' > "$request"
            curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @"$request" > "$response"
            echo "=== $needle ==="
            jq '{count: .result.events.count, events: (.result.events.events // [])}' "$response"
          }
          query_raw "maintenance repair queued from issue webhook"
          query_raw "git clone --no-tags --single-branch --branch main https://github.com/AyobamiH/donestate.git /workspace/repo"
          query_raw "DoneState run stopped"

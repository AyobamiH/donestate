name: Query canary 79 observability

on:
  push:
    branches:
      - ops/diagnose-canary-79

permissions:
  contents: read

jobs:
  query:
    if: github.event.head_commit.message == 'Trace canary 79 execution failure'
    runs-on: ubuntu-latest
    steps:
      - name: Query bounded production failure signals
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          query_logs() {
            local needle="$1"
            local slug
            slug=$(printf '%s' "$needle" | tr ' /' '__' | tr -cd '[:alnum:]_-')
            local request="$RUNNER_TEMP/request-$slug.json"
            local response="$RUNNER_TEMP/response-$slug.json"
            jq -n --arg needle "$needle" '{
              queryId: "donestate-canary-79-trace",
              timeframe: {from: 1788379320000, to: 1788402600000},
              view: "events",
              limit: 200,
              parameters: {
                datasets: [],
                filterCombination: "and",
                filters: [{key: "$metadata.service", operation: "eq", type: "string", value: "donestate-mcp"}],
                limit: 100,
                needle: {value: $needle, isRegex: false, matchCase: false}
              }
            }' > "$request"
            curl -fsS \
              -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @"$request" > "$response"
            echo "=== $needle ==="
            jq '{count: .result.events.count, events: [(.result.events.events // [])[] | {
              timestamp,
              metadata: ((.["$metadata"] // {}) | {message, error, level, type, origin, service}),
              workers: ((.["$workers"] // {}) | {eventType, outcome, entrypoint, durableObjectId, scriptVersion})
            }]}' "$response"
          }
          query_logs "sandbox.exec error"
          query_logs "DoneState run stopped"
          query_logs "failed clone sandbox cleanup"
          query_logs "automatic independent verification did not complete"
          query_logs "publication_started"
          query_logs "harness_started"

name: Query canary 79 observability

on:
  push:
    branches:
      - ops/diagnose-canary-79

permissions:
  contents: read

jobs:
  query:
    if: github.event.head_commit.message == 'Resolve canary 79 queued run identity'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve bounded queue log identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/request.json"
          response="$RUNNER_TEMP/response.json"
          jq -n '{
            queryId: "donestate-canary-79-identity",
            timeframe: {from: 1788379320000, to: 1788380400000},
            view: "events",
            limit: 100,
            parameters: {
              datasets: [],
              filterCombination: "and",
              filters: [{key: "$metadata.service", operation: "eq", type: "string", value: "donestate-mcp"}],
              limit: 100,
              needle: {value: "maintenance repair queued from issue webhook", isRegex: false, matchCase: false}
            }
          }' > "$request"
          curl -fsS \
            -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @"$request" > "$response"
          jq '{count: .result.events.count, events: [(.result.events.events // [])[] | {
            timestamp,
            runId: (.runId // .run_id // .["runId"] // .["run_id"] // null),
            findingId: (.findingId // .finding_id // .["findingId"] // .["finding_id"] // null),
            repository: (.repository // null),
            metadata: ((.["$metadata"] // {}) | {message, service}),
            topLevelKeys: (keys | map(select(test("run|finding|repository"; "i"))))
          }]}' "$response"

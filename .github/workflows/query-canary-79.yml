name: Inspect canary 103 Sandbox configuration ordering

on:
  push:
    branches:
      - ops/diagnose-canary-79

permissions:
  contents: read

jobs:
  query:
    if: github.event.head_commit.message == 'Inspect canary 103 Sandbox configuration ordering'
    runs-on: ubuntu-latest
    steps:
      - name: Query bounded configuration signals
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          query_logs() {
            local needle="$1"
            local slug request response
            slug=$(printf '%s' "$needle" | tr ' /:!' '_____' | tr -cd '[:alnum:]_-')
            request="$RUNNER_TEMP/request-$slug.json"
            response="$RUNNER_TEMP/response-$slug.json"
            jq -n --arg needle "$needle" '{
              queryId: "donestate-canary-103-config-order",
              timeframe: {from: 1788440040000, to: 1788440200000},
              view: "events",
              limit: 500,
              parameters: {
                datasets: [],
                filterCombination: "and",
                filters: [
                  {key: "$metadata.service", operation: "eq", type: "string", value: "donestate-mcp"},
                  {key: "$workers.durableObjectId", operation: "eq", type: "string", value: "68cab69aaa11d8b8727dd4eeea876c9dcabe2ca367943627bb0cde9e89f6653e"}
                ],
                limit: 300,
                needle: {value: $needle, isRegex: false, matchCase: false}
              }
            }' > "$request"
            curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @"$request" > "$response"
            echo "=== $needle ==="
            jq '{count: .result.events.count, events: [(.result.events.events // [])[] | {
              timestamp,
              metadata: ((.["$metadata"] // {}) | {message, error, level, origin, service}),
              workers: ((.["$workers"] // {}) | {eventType, outcome, entrypoint, durableObjectId, scriptVersion, traceId})
            }]}' "$response"
          }
          for needle in \
            "configure" \
            "setKeepAlive" \
            "setSleepAfter" \
            "Using rpc transport" \
            "git clone --no-tags" \
            "nohup /bin/sh" \
            "Container cleaned up successfully"; do
            query_logs "$needle"
          done

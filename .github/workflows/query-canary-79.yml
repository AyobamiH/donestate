name: Observe detached-receipt canary 101

on:
  push:
    branches:
      - ops/diagnose-canary-79

permissions:
  contents: read

jobs:
  query:
    if: github.event.head_commit.message == 'Observe detached-receipt canary 101'
    runs-on: ubuntu-latest
    steps:
      - name: Query bounded production signals
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          query_logs() {
            local needle="$1"
            local slug request response
            slug=$(printf '%s' "$needle" | tr ' /:!' '_____' | tr -cd '[:alnum:]_-')
            request="$RUNNER_TEMP/request-$slug.json"
            response="$RUNNER_TEMP/response-$slug.json"
            jq -n --arg needle "$needle" '{
              queryId: "donestate-canary-101-observation",
              timeframe: {from: 1788427410000, to: 1788430500000},
              view: "events",
              limit: 400,
              parameters: {
                datasets: [],
                filterCombination: "and",
                filters: [{key: "$metadata.service", operation: "eq", type: "string", value: "donestate-mcp"}],
                limit: 250,
                needle: {value: $needle, isRegex: false, matchCase: false}
              }
            }' > "$request"
            curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @"$request" > "$response"
            echo "=== $needle ==="
            jq '{count: .result.events.count, events: [(.result.events.events // [])[] | {
              timestamp,
              runId, findingId, state, detail, reason, failureKind, actionId,
              metadata: ((.["$metadata"] // {}) | {message, error, level, origin, service}),
              workers: ((.["$workers"] // {}) | {eventType, outcome, entrypoint, durableObjectId, scriptVersion, traceId})
            }]}' "$response"
          }
          for needle in \
            "maintenance repair queued from issue webhook" \
            "nohup /bin/sh" \
            "AMBIGUOUS_EFFECT" \
            "FAILED_SAFE" \
            "BLOCKED_CAPABILITY" \
            "validation_started" \
            "publication_started" \
            "git push origin" \
            "automatic independent verification" \
            "maintenance verification retry completed" \
            "VERIFIED" \
            "DoneState run stopped"; do
            query_logs "$needle"
          done

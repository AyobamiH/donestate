name: Query canary 79 observability

on:
  push:
    branches:
      - ops/diagnose-canary-79

permissions:
  contents: read

jobs:
  query:
    if: github.event.head_commit.message == 'Compare successful and failed Sandbox windows'
    runs-on: ubuntu-latest
    steps:
      - name: Compare bounded production windows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          query_logs() {
            local label="$1" from="$2" to="$3" needle="$4"
            local slug request response
            slug=$(printf '%s-%s' "$label" "$needle" | tr ' /:!' '_____' | tr -cd '[:alnum:]_-')
            request="$RUNNER_TEMP/request-$slug.json"
            response="$RUNNER_TEMP/response-$slug.json"
            jq -n --arg needle "$needle" --argjson from "$from" --argjson to "$to" '{
              queryId: "donestate-sandbox-then-now",
              timeframe: {from: $from, to: $to},
              view: "events",
              limit: 200,
              parameters: {
                datasets: [],
                filterCombination: "and",
                filters: [{key: "$metadata.service", operation: "eq", type: "string", value: "donestate-mcp"}],
                limit: 100,
                needle: {value: $needle, isRegex: false, matchCase: false}
              }
            }' > "$request"
            curl -fsS -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @"$request" > "$response"
            echo "=== $label :: $needle ==="
            jq '{count: .result.events.count, events: [(.result.events.events // [])[] | {
              timestamp,
              metadata: ((.["$metadata"] // {}) | {message, error, level, type, origin, service}),
              workers: ((.["$workers"] // {}) | {eventType, outcome, entrypoint, durableObjectId, scriptVersion})
            }]}' "$response"
          }

          # #66 successful implementation/publication window.
          for needle in "version mismatch" "transport" "sandbox.exec error" "HTTP error! status: 500" "codex --ask-for-approval" "DoneState run stopped"; do
            query_logs success66 1788338400000 1788339900000 "$needle"
          done

          # #79 failed implementation window.
          for needle in "version mismatch" "transport" "sandbox.exec error" "HTTP error! status: 500" "codex --ask-for-approval" "DoneState run stopped"; do
            query_logs failure79 1788379200000 1788380100000 "$needle"
          done

name: Inspect canary 105 raw queue event
on:
  push:
    branches: [ops/diagnose-canary-79]
permissions:
  contents: read
jobs:
  query:
    if: github.event.head_commit.message == 'Inspect canary 105 raw queue event'
    runs-on: ubuntu-latest
    steps:
      - name: Query raw queue and alarm signals
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          query() {
            local needle="$1" response="$RUNNER_TEMP/response.json"
            jq -n --arg needle "$needle" '{queryId:"canary-105-raw",timeframe:{from:1788443000000,to:1788450000000},view:"events",limit:500,parameters:{datasets:[],filterCombination:"and",filters:[{key:"$metadata.service",operation:"eq",type:"string",value:"donestate-mcp"}],limit:300,needle:{value:$needle,isRegex:false,matchCase:false}}}' > "$RUNNER_TEMP/request.json"
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/request.json" > "$response"
            echo "=== $needle ==="
            jq '{count:.result.events.count,events:(.result.events.events // [])}' "$response"
          }
          query "maintenance repair queued from issue webhook"
          query "run_queued"
          query "RunCoordinator"

name: Trace canary 85 exact execution span

on:
  push:
    branches:
      - ops/diagnose-canary-79

permissions:
  contents: read

jobs:
  query:
    if: github.event.head_commit.message == 'Trace canary 85 exact execution span'
    runs-on: ubuntu-latest
    steps:
      - name: Query one production execution trace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/request.json"
          response="$RUNNER_TEMP/response.json"
          jq -n '{
            queryId: "donestate-canary-85-exact-trace",
            timeframe: {from: 1788407770000, to: 1788407850000},
            view: "events",
            limit: 500,
            parameters: {
              datasets: [],
              filterCombination: "and",
              filters: [
                {key: "$metadata.service", operation: "eq", type: "string", value: "donestate-mcp"},
                {key: "$workers.traceId", operation: "eq", type: "string", value: "ee9e1464e736c4fe2d519031bfc7d091"}
              ],
              limit: 500
            }
          }' > "$request"
          curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @"$request" > "$response"
          jq '{count: .result.events.count, events: [(.result.events.events // [])[] | {
            timestamp,
            source: (.source // {}),
            workers: ((.["$workers"] // {}) | {eventType, outcome, entrypoint, durableObjectId, scriptVersion, traceId, spanId}),
            metadata: ((.["$metadata"] // {}) | {message, error, level, origin, traceId, spanId})
          }]}' "$response"

name: Inspect canary 112 admission

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - name: Query issue 112 admission signals
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          now=$(date +%s000)
          from=$((now - 900000))
          query() {
            local needle="$1" response="$RUNNER_TEMP/response.json"
            jq -n --arg needle "$needle" --argjson from "$from" --argjson to "$now" '{queryId:"canary-112-admission",timeframe:{from:$from,to:$to},view:"events",limit:500,parameters:{datasets:[],filterCombination:"and",filters:[],limit:300,needle:{value:$needle,isRegex:false,matchCase:false}}}' > "$RUNNER_TEMP/request.json"
            curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" -H "Authorization: $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @"$RUNNER_TEMP/request.json" > "$response"
            jq -c --arg needle "$needle" '
              def scalar_pairs:
                paths(scalars) as $p
                | {path: ($p | map(tostring) | join(".")), value: getpath($p)};
              {needle:$needle,count:(.result.events.count // 0),signals:[
                ((.result.events.events // []) | to_entries[]) as $entry
                | ($entry.value | scalar_pairs)
                | select(.path | test("message|run|issue|state|status|receipt|branch|pull|implement|verif|attest|error|time|id|objective|action|event|command|process|service|session|container|exitCode";"i"))
                | select((.value|tostring|length) < 1400)
                | {event:$entry.key,path:.path,value:.value}
              ][0:500]}' "$response"
          }
          query "maintenance repair queued from issue webhook"
          query "112"

name: One-shot quota governance closure

on:
  push:
    branches:
      - ops/quota-override-12
    paths:
      - .github/workflows/one-shot-quota-governance.yml

permissions:
  contents: write

jobs:
  close-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/quota-override-12
          fetch-depth: 0
      - name: Append canonical evidence and render state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('governance/project-ledger.json')
          text = path.read_text()
          ledger = json.loads(text)
          if any(story.get('id') == 'E-035' for story in ledger['evidenceStories']):
              raise SystemExit('E-035 already exists')

          story = {
            "id": "E-035",
            "date": "2026-09-03",
            "identity": "Issue 110 capability block and minimal production run-quota override",
            "situation": "Fresh successor issue 110 reached execution-credential admission after the tracked-waiter repair but failed closed before any Codex implementation launch because the configured daily autonomous-run limit of 10 had been reached.",
            "verification": "Read-only diagnostic workflow 33797877330 observed run 05aee1b9-9d24-47dd-af4c-701b9ad5c3fc in BLOCKED_CAPABILITY with error daily autonomous-run limit reached and zero matching implementation-process, Codex-command, or terminal-receipt signals. PR 111 starts from exact main 4f60b5892674471fb6428b4c372575dbde2d25a1 and changes only apps/mcp-worker/wrangler.jsonc USER_DAILY_RUN_LIMIT from 10 to 12; Sandbox max_instances remains 5 and Sandbox, Codex, receipt, OpsTruth, scheduler and PR-only authority semantics remain unchanged. Initial exact-head CI 33800619283 passed core (24); core (22) passed npm run check and then correctly failed governance:impact because this canonical evidence and generated project state were not yet part of the change.",
            "accountability": {
              "owner": "DoneState maintainers",
              "status": "active",
              "nextAction": "Require PR 111 to pass core (22), core (24), hosted-plugin and governance impact on its final exact head, merge and deploy only the quota-only repair, then create one fresh successor canary with a new run identity and continue through exact-head CI, OpsTruth v2 and DoneState VERIFIED without merging the canary PR.",
              "waitCondition": "Issue 110 and run 05aee1b9-9d24-47dd-af4c-701b9ad5c3fc remain immutable BLOCKED_CAPABILITY evidence and must not be reset, reused or rewritten. Do not create the successor until the quota-only repair is green, merged and deployed.",
              "staleDate": "2026-09-10"
            },
            "outcome": "The current blocker is isolated to a clean pre-execution capability gate, so no ambiguous Codex effect or historical maintenance evidence is disturbed by the minimal quota override.",
            "content": "Exact issue-110 run and diagnostic identities, pre-Codex capability stop, one-variable production quota change, retained global Sandbox cap, unchanged execution and verification contracts, and fresh-successor gate.",
            "measurement": "One fresh blocked run, zero Codex launches, zero terminal receipts, zero publication branches, zero canary pull requests and zero OpsTruth decisions for issue 110; one production configuration value proposed from 10 to 12 with all other canary subjects unchanged."
          }

          marker = '\n  ]\n}\n'
          if not text.endswith(marker):
              raise SystemExit('unexpected ledger ending')
          insertion = ',\n    ' + json.dumps(story, separators=(',', ':')) + marker
          path.write_text(text[:-len(marker)] + insertion)
          PY
          node scripts/render-project-state.mjs
          git rm .github/workflows/one-shot-quota-governance.yml
          git diff --check
      - name: Commit governance closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ayobami Haastrup"
          git config user.email "47716486+AyobamiH@users.noreply.github.com"
          git add governance/project-ledger.json docs/PROJECT-STATE.md
          git commit -m "Record quota-blocked canary and override"
          git push origin HEAD:ops/quota-override-12

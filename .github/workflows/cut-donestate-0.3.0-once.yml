name: Cut DoneState 0.3.0 once

on:
  push:
    branches:
      - release/donestate-0.3.0

permissions:
  contents: write

jobs:
  cut-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/donestate-0.3.0
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Cut coherent 0.3.0 release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          (cd apps/mcp-worker && npm version 0.3.0 --no-git-tag-version)

          node <<'NODE'
          const fs = require('fs');

          const serverPath = 'apps/mcp-worker/src/server.ts';
          let server = fs.readFileSync(serverPath, 'utf8');
          const oldServer = 'new McpServer({ name: "DoneState", version: "0.2.0" })';
          const newServer = 'new McpServer({ name: "DoneState", version: "0.3.0" })';
          if (!server.includes(oldServer)) throw new Error('DoneState server version source not found');
          server = server.replace(oldServer, newServer);
          fs.writeFileSync(serverPath, server);

          const pluginPath = 'plugins/donestate/.codex-plugin/plugin.json';
          const plugin = JSON.parse(fs.readFileSync(pluginPath, 'utf8'));
          if (plugin.version !== '0.2.0') throw new Error(`unexpected DoneState plugin version ${plugin.version}`);
          plugin.version = '0.3.0';
          fs.writeFileSync(pluginPath, JSON.stringify(plugin, null, 2) + '\n');

          const candidatePath = 'distribution/current-release-candidate.json';
          const candidate = JSON.parse(fs.readFileSync(candidatePath, 'utf8'));
          candidate.releaseVersionDecision = {
            version: '0.3.0',
            previousReviewVersion: '0.2.0',
            reason: 'The reviewed MCP snapshot exposed 19 tools; the proven current runtime exposes 20 and adds submit_verifier_response for the complete donestate.verification-contract.v2 response while retaining submit_verifier_attestation only for historical compatibility. OpenAI requires a new plugin version to change a reviewed MCP metadata or skill snapshot.',
            previousToolCount: 19,
            currentToolCount: 20,
            toolCatalogueChanged: true
          };
          candidate.plugin.manifestVersion = '0.3.0';
          candidate.runtime.releaseRequirement = 'Deploy the merged 0.3.0 release commit and bind the provider scan to that exact deployed source before submitting the new plugin version.';
          candidate.openAIProviderAction = {
            target: 'EXISTING_DONESTATE_APP_AND_PRODUCT',
            newVersion: '0.3.0',
            actionOrder: [
              'MERGE_AND_DEPLOY_EXACT_0_3_0_RELEASE_SOURCE',
              'OPEN_EXISTING_PUBLISHER_RECORD',
              'CREATE_NEW_VERSION_0_3_0_ON_EXISTING_PRODUCT',
              'USE_CANONICAL_MCP_ENDPOINT',
              'SCAN_LIVE_CANONICAL_MCP_SERVER',
              'REVIEW_THE_FROZEN_20_TOOL_AND_SKILL_SNAPSHOT',
              'PRESERVE_EXISTING_PUBLISHER_IDENTITY_AND_REVIEWER_CREDENTIAL_CHANNEL',
              'SUBMIT_0_3_0_FOR_REVIEW',
              'PUBLISH_THE_APPROVED_0_3_0_VERSION',
              'RUN_CLEAN_ACCOUNT_INSTALL_AND_END_TO_END_USER_CANARY'
            ],
            doNot: [
              'CREATE_DUPLICATE_DONESTATE_PRODUCT',
              'PUBLISH_STALE_0_2_0_WORKERS_DEV_SNAPSHOT',
              'CLAIM_0_3_0_PUBLIC_BEFORE_PROVIDER_APPROVAL_AND_PUBLICATION'
            ]
          };
          fs.writeFileSync(candidatePath, JSON.stringify(candidate, null, 2) + '\n');

          const ledgerPath = 'governance/project-ledger.json';
          const ledger = JSON.parse(fs.readFileSync(ledgerPath, 'utf8'));
          ledger.updatedAt = '2026-09-04';
          const item = ledger.workItems.find(x => x.id === 'OPENAI-001');
          if (!item) throw new Error('OPENAI-001 missing');
          item.status = 'active';
          item.lastUpdated = '2026-09-04';
          item.staleDate = '2026-09-12';
          item.nextAction = 'Merge and deploy the exact DoneState 0.3.0 release, scan https://donestate.proofandstate.com/mcp in the existing OpenAI publisher record, submit new version 0.3.0 for review, then publish the approved version and run a clean-account end-to-end install canary.';
          item.waitCondition = 'Provider submission cannot truthfully start until the exact 0.3.0 release source is merged and deployed; the historical 0.2.0 review remains stale evidence, not the target release.';
          item.reentryCondition = 'Continue immediately through release merge, exact deployment, provider scan, review submission, publication and clean-account canary. Do not create a duplicate product.';
          item.evidenceIds ||= [];
          if (!item.evidenceIds.includes('E-040')) item.evidenceIds.push('E-040');

          if (!ledger.evidenceStories.some(x => x.id === 'E-040')) {
            ledger.evidenceStories.push({
              id: 'E-040',
              date: '2026-09-04',
              identity: 'DoneState 0.3.0 distribution release candidate selected from the proven production runtime',
              situation: 'The OpenAI 0.2.0 review snapshot predates the production-proven DoneState-to-OpsTruth v2 loop and is 224 commits behind current repository truth. Distribution must advance the existing DoneState product rather than publish that stale snapshot or create a duplicate.',
              verification: 'The submitted 0.2.0 source 1588c0588dfcbfcefc70cda71e8197c1b14b7fed registers 19 MCP tools. The deployed production source e75a78e45f73ce8eebd13284c5bd52097bc764cc registers 20, adding submit_verifier_response for the complete donestate.verification-contract.v2 bundle while retaining submit_verifier_attestation as historical compatibility. Current repository truth before this version cut is 99cbf9701dae9dc408fb42b0f26a130345347175, and runtime code did not change in the 22 commits after e75a78e45f73ce8eebd13284c5bd52097bc764cc. OpenAI submission guidance requires a new plugin version when reviewed MCP metadata or skill snapshots change.',
              accountability: {
                owner: 'Publisher owner',
                status: 'active',
                nextAction: 'Merge and deploy 0.3.0, scan the canonical MCP endpoint in the existing publisher product, submit 0.3.0 for review, publish after approval, and prove a clean-account install and real end-to-end outcome.',
                waitCondition: 'Exact 0.3.0 merge and deployment must precede provider submission.',
                staleDate: '2026-09-12'
              },
              outcome: 'The next DoneState directory release is 0.3.0 and is bound to the existing DoneState product identity; the stale 0.2.0 review is not treated as the target public release.',
              content: 'Version decision, 19-to-20 MCP tool delta, canonical MCP endpoint, existing app/product identity, production VERIFIED proof chain, release/deploy/submission/publication order and duplicate-product prohibition.',
              measurement: 'One existing product identity, one selected 0.3.0 release, 20 current MCP tools, one new complete-response submission tool, zero autonomous merges, zero duplicate products and zero historical outcomes rewritten.'
            });
          }
          fs.writeFileSync(ledgerPath, JSON.stringify(ledger, null, 2) + '\n');
          NODE

          cat > distribution/openai-0.3.0-release-notes.md <<'EOF'
          # DoneState 0.3.0

          This update advances DoneState from the older 0.2.0 review snapshot to the production-proven PR-only maintenance and independent-verification path.

          - Uses the canonical `https://donestate.proofandstate.com/mcp` service identity.
          - Keeps DoneState PR-only: it can create a bounded branch and pull request but cannot approve or merge its own work.
          - Uses durable isolated execution with explicit consequence authority and fail-closed ambiguous-effect handling.
          - Adds the complete `donestate.verification-contract.v2` response path through `submit_verifier_response`; the older attestation-only tool remains for historical compatibility.
          - Requires an independent verifier such as OpsTruth for terminal `VERIFIED`; DoneState cannot sign or accept its own completion claim.
          - Proven in production through issue #114 / run `c4a07fa6-90b2-4597-a4c6-eae66de5a3e8` / open-unmerged PR #115, including rejection of a malformed verifier response followed by acceptance of a complete verified v2 response.
          - Preserves historical ambiguous, blocked and awaiting-verification outcomes rather than rewriting them after later success.

          The MCP catalogue changes from 19 reviewed tools in 0.2.0 to 20 tools in 0.3.0 by adding the complete versioned verifier-response submission path.
          EOF

          npm ci
          npm run governance:render
          npm run check
          (cd apps/mcp-worker && npm ci && npm run check)
          node scripts/validate-plugin.mjs

          git rm .github/workflows/cut-donestate-0.3.0-once.yml
          git add apps/mcp-worker/package.json apps/mcp-worker/package-lock.json apps/mcp-worker/src/server.ts plugins/donestate/.codex-plugin/plugin.json distribution/current-release-candidate.json distribution/openai-0.3.0-release-notes.md governance/project-ledger.json docs/PROJECT-STATE.md
          git commit -m "Cut DoneState 0.3.0 distribution release"
          git push origin HEAD:release/donestate-0.3.0

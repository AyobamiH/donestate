name: Normalize issue 105 governance closure

on:
  push:
    branches:
      - repair/detach-start-process-session

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message == 'Prepare issue 105 governance closure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Patch canonical issue 105 evidence from exact base
        env:
          BASE_SHA: 8b073250bfd01e8fca14755209a673ae42f5f5f0
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:governance/project-ledger.json" > "$RUNNER_TEMP/base-ledger.json"
          python - <<'PY'
          from pathlib import Path
          import json

          base_path = Path('/home/runner/work/_temp/base-ledger.json')
          text = base_path.read_text()
          ledger = json.loads(text)

          def item(item_id):
              return next(x for x in ledger['workItems'] if x['id'] == item_id)

          verify006 = item('VERIFY-006')
          verify006['nextAction'] = (
              'Review PR 107 after canonical governance closure and exact-head CI. If all required checks pass, '
              'merge and deploy the isolated startProcess session-detachment repair, then launch one fresh successor '
              'canary. Preserve the atomic terminal receipt as the sole completion authority, exactly one implementation '
              'launch, Sandbox 0.12.9, RPC, keepAlive, sessionless execution, Codex 0.150.1, PR-only canary publication '
              'and OpsTruth v2.'
          )
          verify006['waitCondition'] = (
              'Issue 105 / run 70310be5-5abe-413f-9643-f9e8e2425cc2 is terminal AMBIGUOUS_EFFECT: clone succeeded, '
              'exactly one startProcess launch was acknowledged, but no matching donestate.implementation-receipt.v1 '
              'appeared before the deadline; no validation, publication or OpsTruth verification followed. Draft PR 107 '
              'changes only the startProcess launch command to enter an independent Unix session with `setsid -f` and '
              'versions the durable execution mode. Its first exact-head CI workflow 33788125800 passed hosted-plugin and '
              'both npm run check paths, while core (22) failed only because governance/project-ledger.json and generated '
              'docs/PROJECT-STATE.md had not yet been updated; core (24) was then cancelled. Cloudflare sandbox-sdk issue '
              '891 is supporting evidence for a managed-session process-tree lifetime defect and reports `setsid -f` as '
              'a mitigation, but it is not treated as proof that issue 105 hit the identical SDK defect.'
          )
          if 'E-033' not in verify006['evidenceIds']:
              verify006['evidenceIds'].append('E-033')

          verify004 = item('VERIFY-004')
          verify004['nextAction'] = (
              'After PR 107 is green, reviewed, merged and deployed, create exactly one fresh PR-only maintenance canary. '
              'Require one durable run, exactly one implementation launch, a verified terminal receipt, validation, one '
              '`donestate/<run-id>` branch and pull request, exact-head core (22), core (24) and hosted-plugin checks, a '
              'complete OpsTruth v2 response, and truthful DoneState VERIFIED read-back while leaving the canary PR unmerged.'
          )
          verify004['waitCondition'] = (
              'Issue 105 / run 70310be5-5abe-413f-9643-f9e8e2425cc2 is immutable terminal AMBIGUOUS_EFFECT evidence and '
              'cannot be the successor. The fresh successor is blocked only until PR 107 is exact-head green, merged and '
              'deployed. No intermediate AWAITING_VERIFICATION, uncertain, branch creation, PR creation or CI success is '
              'the end-to-end success condition.'
          )
          if 'E-033' not in verify004['evidenceIds']:
              verify004['evidenceIds'].append('E-033')

          story = {
              'id': 'E-033',
              'date': '2026-09-03',
              'identity': 'Issue 105 startProcess canary preserved; session-detachment repair isolated in PR 107',
              'situation': (
                  'The first production canary after PR 104 used the supported Sandbox startProcess primitive with a '
                  'deterministic process ID and the existing DoneState-owned atomic terminal receipt, but the canary still '
                  'never produced the receipt.'
              ),
              'verification': (
                  'DoneState run 70310be5-5abe-413f-9643-f9e8e2425cc2 is terminal AMBIGUOUS_EFFECT. Clone succeeded, the '
                  'implementation launch was acknowledged exactly once, receipt reconciliation continued until the '
                  'configured deadline, and no validation, branch, pull request or OpsTruth verification followed. Draft '
                  'PR 107 from base 8b073250bfd01e8fca14755209a673ae42f5f5f0 changes only the startProcess launch command '
                  'to `setsid -f /bin/sh "$DONESTATE_RECEIPT_SCRIPT_PATH" > "$DONESTATE_RECEIPT_LOG_PATH" 2>&1`, versions '
                  'the durable execution mode to single_start_process_setsid_terminal_receipt_alarm_resumable_v5, and pins '
                  'the contract in the executor regression. Initial exact-head CI 33788125800 passed hosted-plugin and both '
                  'npm run check paths; core (22) failed only at governance:impact because this ledger and its generated '
                  'project-state view had not yet changed, and core (24) was cancelled after that failure. Cloudflare '
                  'sandbox-sdk issue 891 independently reports startProcess-managed process trees being killed with session '
                  'teardown and reports `setsid -f` as a mitigation; this is supporting evidence rather than identity proof '
                  'for the production failure.'
              ),
              'accountability': {
                  'owner': 'DoneState maintainers',
                  'status': 'active',
                  'nextAction': (
                      'Commit canonical governance closure to PR 107, require all three exact-head checks to pass, merge and '
                      'deploy the isolated repair, then launch one fresh successor canary and continue until the full '
                      'OpsTruth-backed VERIFIED loop passes.'
                  ),
                  'waitCondition': (
                      'Do not retry, reset, reopen or rewrite issue 105/run 70310be5-5abe-413f-9643-f9e8e2425cc2. Do not '
                      'create the successor before PR 107 is green, merged and deployed.'
                  ),
                  'staleDate': '2026-09-10',
              },
              'outcome': (
                  'The queue, clone, alarm slicing and one-launch admission layers remain proven; the unsolved liveness '
                  'boundary is narrowed to the lifetime of the startProcess-launched receipt worker. PR 107 isolates '
                  'Unix-session detachment without changing receipt authority, Codex semantics, verifier semantics or '
                  'publication authority.'
              ),
              'content': (
                  'Terminal issue-105 run identity and action result, PR 107 base/branch/repair surface, initial exact-head '
                  'CI result, supporting Cloudflare session-lifetime evidence, unchanged safety boundaries, and the '
                  'fresh-successor gate.'
              ),
              'measurement': (
                  'One terminal issue-105 run, one acknowledged implementation launch, zero terminal receipts, zero '
                  'validations, zero publication branches, zero canary pull requests and zero OpsTruth calls; one two-file '
                  'runtime/test repair PR; one initial CI workflow with hosted-plugin green, both npm checks green, and one '
                  'governance-only failure.'
              ),
          }

          def patch_work_item(source, item_id, desired):
              marker = f'"id":"{item_id}"'
              start = source.index(marker)
              line_start = source.rfind('\n', 0, start) + 1
              end = source.index('\n    },', start)
              block = source[line_start:end]
              lines = block.splitlines()
              for index, line in enumerate(lines):
                  if '"nextAction":' in line and '"waitCondition":' in line and '"evidenceIds":' in line:
                      indent = line[:len(line)-len(line.lstrip())]
                      lines[index] = (
                          indent
                          + '"nextAction":' + json.dumps(desired['nextAction'], ensure_ascii=False)
                          + ',"waitCondition":' + json.dumps(desired['waitCondition'], ensure_ascii=False)
                          + ',"reentryCondition":' + json.dumps(desired['reentryCondition'], ensure_ascii=False)
                          + ',"dependencies":' + json.dumps(desired['dependencies'], separators=(',', ':'), ensure_ascii=False)
                          + ',"evidenceIds":' + json.dumps(desired['evidenceIds'], separators=(',', ':'), ensure_ascii=False)
                      )
                      return source[:line_start] + '\n'.join(lines) + source[end:]
              raise SystemExit(f'work-item layout drifted for {item_id}')

          text = patch_work_item(text, 'VERIFY-006', verify006)
          text = patch_work_item(text, 'VERIFY-004', verify004)

          if '"id":"E-033"' in text:
              raise SystemExit('E-033 unexpectedly exists in base ledger')
          a = story['accountability']
          evidence = (
              '    ,{\n'
              + '      "id":' + json.dumps(story['id'])
              + ',"date":' + json.dumps(story['date'])
              + ',"identity":' + json.dumps(story['identity'])
              + ',"situation":' + json.dumps(story['situation'])
              + ',"verification":' + json.dumps(story['verification']) + ',\n'
              + '      "accountability":{"owner":' + json.dumps(a['owner'])
              + ',"status":' + json.dumps(a['status'])
              + ',"nextAction":' + json.dumps(a['nextAction'])
              + ',"waitCondition":' + json.dumps(a['waitCondition'])
              + ',"staleDate":' + json.dumps(a['staleDate']) + '},\n'
              + '      "outcome":' + json.dumps(story['outcome'])
              + ',"content":' + json.dumps(story['content'])
              + ',"measurement":' + json.dumps(story['measurement']) + '\n'
              + '    }'
          )
          tail = '\n  ]\n}'
          if text.count(tail) != 1:
              raise SystemExit('evidence tail layout drifted')
          text = text.replace(tail, '\n' + evidence + tail)
          Path('governance/project-ledger.json').write_text(text)
          PY
      - name: Render generated project state
        run: npm run governance:render
      - name: Validate exact review tree
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          (cd apps/mcp-worker && npm ci && npm run check)
          node scripts/validate-plugin.mjs
          npm run governance:impact -- 8b073250bfd01e8fca14755209a673ae42f5f5f0
      - name: Publish clean governance closure
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/normalize-issue-105-governance.yml
          expected=$(printf '%s\n' \
            apps/mcp-worker/src/executor.ts \
            apps/mcp-worker/test/executor.test.ts \
            docs/PROJECT-STATE.md \
            governance/project-ledger.json | sort -u)
          actual=$( { git diff --name-only 8b073250bfd01e8fca14755209a673ae42f5f5f0; git ls-files --others --exclude-standard; } | sed '/^$/d' | grep -v '^.github/workflows/normalize-issue-105-governance.yml$' | sort -u )
          test "$actual" = "$expected"
          git diff --check
          git config user.name 'Ayobami Haastrup'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add apps/mcp-worker/src/executor.ts apps/mcp-worker/test/executor.test.ts docs/PROJECT-STATE.md governance/project-ledger.json
          git add -u .github/workflows/normalize-issue-105-governance.yml
          git commit -m 'Close issue 105 governance evidence'
          git push origin HEAD:repair/detach-start-process-session

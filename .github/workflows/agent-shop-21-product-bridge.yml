name: Agent Shop 21 Product Bridge

on:
  push:
    branches:
      - ops/agent-shop-21-product-bridge
    paths:
      - ".github/workflows/agent-shop-21-product-bridge.yml"

permissions:
  contents: read

concurrency:
  group: agent-shop-21-product-bridge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACCEPTANCE_ORIGIN: https://agents.proofandstate.com
      VITE_SITE_ORIGIN: https://agents.proofandstate.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AGENT_SHOP_REVISION: ea739b15c3a6f4c326dd4dfe6400a2eb91928b42
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify Cloudflare credential custody
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Fetch canonical agent shop
        run: |
          git clone --filter=blob:none https://github.com/AyobamiH/agent-shop-products.git agent-shop-products
          cd agent-shop-products
          git checkout "$AGENT_SHOP_REVISION"
          test "$(git rev-parse HEAD)" = "$AGENT_SHOP_REVISION"
      - name: Install and build
        working-directory: agent-shop-products/frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Validate Cloudflare Worker bundle
        working-directory: agent-shop-products/frontend
        run: bunx wrangler@4.135.0 deploy --dry-run --config wrangler.jsonc --outdir /tmp/agent-shop-worker
      - name: Deploy exact Agent Shop revision
        working-directory: agent-shop-products/frontend
        run: bunx wrangler@4.135.0 deploy --config wrangler.jsonc
      - name: Wait for production origin
        run: |
          for i in {1..60}; do
            if curl --fail --silent --show-error --location "$ACCEPTANCE_ORIGIN/agents" >/dev/null; then
              echo "Production origin is reachable."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Production origin did not become reachable."
          exit 1
      - name: Outside-in agent and crawler acceptance
        working-directory: agent-shop-products/frontend
        run: node scripts/verify-deployed-surface.mjs
      - name: Verify registry assets and 21-product public count
        run: |
          curl --fail --silent --show-error "$ACCEPTANCE_ORIGIN/agent-registry-mark.svg" >/dev/null
          curl --fail --silent --show-error "$ACCEPTANCE_ORIGIN/agent-registry-feature.svg" >/dev/null
          curl --fail --silent --show-error "$ACCEPTANCE_ORIGIN/catalog.json" > /tmp/catalog.json
          node - <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync("/tmp/catalog.json", "utf8"));
          if (body.productCount !== 21) {
            console.error("Expected 21 products, got", body.productCount);
            process.exit(1);
          }
          if (body.productCountsByType?.skill !== 10 || body.productCountsByType?.prompt !== 11) {
            console.error("Unexpected type mix", body.productCountsByType);
            process.exit(1);
          }
          console.log("Live catalogue count verified: 21 products (11 prompts, 10 skills).");
          NODE

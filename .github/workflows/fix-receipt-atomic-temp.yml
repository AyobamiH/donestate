name: Validate receipt atomic temp path

on:
  push:
    branches:
      - repair/reconcile-codex-receipt

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Run receipt atomic path correction'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Correct receipt atomic temp path and regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          executor_path = Path('apps/mcp-worker/src/executor.ts')
          executor = executor_path.read_text()
          old = '    \'tmp_path="${receipt_path}.tmp.$"\','
          new = '    \'tmp_path="${receipt_path}.tmp.$$"\','
          if executor.count(old) != 1:
              raise SystemExit('receipt temp-path context drift')
          executor = executor.replace(old, new)

          old_indent = '''  const schema = parts[0]!;
          const runId = parts[1]!;
          const commandDigest = parts[2]!;
          const exitCodeText = parts[3]!;
          const nonce = parts[4]!;'''
          new_indent = '''  const schema = parts[0]!;
            const runId = parts[1]!;
            const commandDigest = parts[2]!;
            const exitCodeText = parts[3]!;
            const nonce = parts[4]!;'''
          if executor.count(old_indent) != 1:
              raise SystemExit('receipt parser indentation context drift')
          executor = executor.replace(old_indent, new_indent)
          executor_path.write_text(executor)

          test_path = Path('apps/mcp-worker/test/executor.test.ts')
          test = test_path.read_text()
          anchor = '    expect(wrapper).toContain(\'mv "$tmp_path" "$receipt_path"\');'
          replacement = '    expect(wrapper).toContain(\'tmp_path="${receipt_path}.tmp.$$"\');\n' + anchor
          if test.count(anchor) != 1:
              raise SystemExit('receipt wrapper regression context drift')
          test_path.write_text(test.replace(anchor, replacement))
          PY
      - name: Install root dependencies
        run: npm ci
      - name: Root validation
        run: npm run check
      - name: Hosted Worker validation
        working-directory: apps/mcp-worker
        run: |
          npm ci
          npm run check
      - name: Plugin validation
        run: node scripts/validate-plugin.mjs
      - name: Prepare exact review commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-receipt-atomic-temp.yml scripts/tmp-receipt-atomic-trigger.txt
          expected=$(printf '%s\n' \
            apps/mcp-worker/src/executor.ts \
            apps/mcp-worker/test/executor.test.ts \
            docs/PROJECT-STATE.md \
            governance/project-ledger.json | sort -u)
          actual=$( { git diff --name-only ce16418f4176906fcf7d3243058bab474631f2fc; git ls-files --others --exclude-standard; } | sed '/^$/d' | sort -u )
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected exact review surface' >&2
            echo 'Expected:' >&2; printf '%s\n' "$expected" >&2
            echo 'Actual:' >&2; printf '%s\n' "$actual" >&2
            exit 1
          fi
          git config user.name 'Ayobami Haastrup'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add apps/mcp-worker/src/executor.ts apps/mcp-worker/test/executor.test.ts
          git add -u .github/workflows/fix-receipt-atomic-temp.yml scripts/tmp-receipt-atomic-trigger.txt
          git diff --cached --check
          git commit -m 'Harden terminal receipt atomic path'
      - name: Governance impact on exact net commit
        run: npm run governance:impact -- ce16418f4176906fcf7d3243058bab474631f2fc
      - name: Push exact review commit
        run: git push origin HEAD:repair/reconcile-codex-receipt

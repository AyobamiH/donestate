name: Validate alarm-sliced execution repair

on:
  push:
    branches:
      - repair/resume-implementation-across-alarms

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message == 'Run alarm-sliced execution repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Normalize staging-helper embedded source literals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          path = Path('scripts/tmp-alarm-sliced-execution.mjs')
          text = path.read_text()
          text = text.replace('throw new Error(`execution checkpoint ${key} is invalid`);', 'throw new Error("execution checkpoint " + key + " is invalid");')
          text = text.replace('throw new Error(`execution checkpoint ${key} is invalid`);', 'throw new Error("execution checkpoint " + key + " is invalid");')
          text = text.replace('throw new RunFailure("BLOCKED_AUTHORITY", `${authority} authority is required for ${id}`);', 'throw new RunFailure("BLOCKED_AUTHORITY", authority + " authority is required for " + id);')
          text = text.replace('throw new RunFailure("BLOCKED_CAPABILITY", `${id} could not execute`, { error: redact(message, secrets) });', 'throw new RunFailure("BLOCKED_CAPABILITY", id + " could not execute", { error: redact(message, secrets) });')
          text = text.replace('throw new RunFailure("FAILED_SAFE", `${id} failed with exit code ${raw.exitCode}`, result);', 'throw new RunFailure("FAILED_SAFE", id + " failed with exit code " + raw.exitCode, result);')

          def literalize_declaration(source, prefix, suffix):
              start = source.index(prefix)
              content_start = start + len(prefix)
              end = source.index(suffix, content_start)
              content = source[content_start:end]
              name = prefix.split('=')[0].strip()
              return source[:start] + name + '= ' + json.dumps(content) + ';' + source[end + len(suffix):]

          def literalize_expression(source, prefix, suffix):
              start = source.index(prefix)
              content_start = start + len(prefix)
              end = source.index(suffix, content_start)
              content = source[content_start:end]
              return source[:start] + prefix[:-1] + json.dumps(content) + suffix[1:] + source[end + len(suffix):]

          text = literalize_declaration(text, 'const tail = String.raw`', '`;\nexecutor = executor.slice')
          text = text.replace(';executor = executor.slice', ';\nexecutor = executor.slice', 1)
          text = literalize_declaration(text, 'const alarmBlock = `', '`;\ncoordinator = coordinator.slice')
          text = text.replace(';coordinator = coordinator.slice', ';\ncoordinator = coordinator.slice', 1)
          text = literalize_declaration(text, 'const implementationMethods = `', '`;\ncoordinator = coordinator.slice')
          text = text.replace(';coordinator = coordinator.slice', ';\ncoordinator = coordinator.slice', 1)
          text = literalize_expression(text, 'executor = executor.slice(0, runActionStart) + `', '` + executor.slice(runActionEnd);')
          text = literalize_expression(text, 'executorTest = executorTest.slice(0, executorTestInsert) + `', '` + executorTest.slice(executorTestInsert);')
          text = literalize_expression(text, 'coordinatorTest = coordinatorTest.slice(0, coordinatorTestInsert) + `', '` + coordinatorTest.slice(coordinatorTestInsert);')
          path.write_text(text)
          PY
          node --check scripts/tmp-alarm-sliced-execution.mjs
      - name: Apply alarm-sliced execution repair
        run: node scripts/tmp-alarm-sliced-execution.mjs
      - name: Install root dependencies
        run: npm ci
      - name: Render governance state
        run: npm run governance:render
      - name: Root validation
        run: npm run check
      - name: Hosted Worker validation
        working-directory: apps/mcp-worker
        run: |
          npm ci
          npm run check
      - name: Plugin validation
        run: node scripts/validate-plugin.mjs
      - name: Prepare exact review commit
        env:
          BASE_SHA: b4febe960fc7e71d48049e3a758256c1b61841ef
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/validate-alarm-sliced-execution.yml scripts/tmp-alarm-sliced-execution.mjs scripts/tmp-alarm-sliced-trigger.txt
          expected=$(printf '%s\n' \
            apps/mcp-worker/src/executor.ts \
            apps/mcp-worker/src/coordinator.ts \
            apps/mcp-worker/test/executor.test.ts \
            apps/mcp-worker/test/coordinator.test.ts \
            docs/PROJECT-STATE.md \
            governance/project-ledger.json | sort -u)
          actual=$( { git diff --name-only "$BASE_SHA"; git ls-files --others --exclude-standard; } | sed '/^$/d' | sort -u )
          if [ "$actual" != "$expected" ]; then
            echo 'Unexpected exact review surface' >&2
            echo 'Expected:' >&2; printf '%s\n' "$expected" >&2
            echo 'Actual:' >&2; printf '%s\n' "$actual" >&2
            exit 1
          fi
          git config user.name 'Ayobami Haastrup'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add apps/mcp-worker/src/executor.ts apps/mcp-worker/src/coordinator.ts apps/mcp-worker/test/executor.test.ts apps/mcp-worker/test/coordinator.test.ts docs/PROJECT-STATE.md governance/project-ledger.json
          git add -u .github/workflows/validate-alarm-sliced-execution.yml scripts/tmp-alarm-sliced-execution.mjs scripts/tmp-alarm-sliced-trigger.txt
          git diff --cached --check
          git commit -m 'Make hosted execution resumable across alarms'
      - name: Governance impact on exact net commit
        run: npm run governance:impact -- b4febe960fc7e71d48049e3a758256c1b61841ef
      - name: Push exact review commit
        run: git push origin HEAD:repair/resume-implementation-across-alarms

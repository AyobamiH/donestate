name: Agent Shop 21 Product Readback

on:
  push:
    branches:
      - ops/agent-shop-21-product-bridge
    paths:
      - ".github/workflows/agent-shop-21-product-readback.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ACCEPTANCE_ORIGIN: https://agents.proofandstate.com
      VITE_SITE_ORIGIN: https://agents.proofandstate.com
      AGENT_SHOP_REVISION: ea739b15c3a6f4c326dd4dfe6400a2eb91928b42
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact Agent Shop verifier
        run: |
          git clone --filter=blob:none https://github.com/AyobamiH/agent-shop-products.git agent-shop-products
          cd agent-shop-products
          git checkout "$AGENT_SHOP_REVISION"
          test "$(git rev-parse HEAD)" = "$AGENT_SHOP_REVISION"
      - name: Wait for public catalogue convergence
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if node - <<'NODE'
          const origin = process.env.ACCEPTANCE_ORIGIN;
          const response = await fetch(origin + "/catalog.json", { cache: "no-store" });
          if (!response.ok) process.exit(1);
          const body = await response.json();
          const ok =
            body.productCount === 21 &&
            body.productCountsByType?.prompt === 11 &&
            body.productCountsByType?.skill === 10;
          console.log(JSON.stringify({
            attempt: process.env.ATTEMPT,
            status: response.status,
            productCount: body.productCount,
            productCountsByType: body.productCountsByType,
          }));
          if (!ok) process.exit(1);
          NODE
            then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Public catalogue did not converge to 21 products."
          exit 1
      - name: Full outside-in acceptance
        working-directory: agent-shop-products/frontend
        run: node scripts/verify-deployed-surface.mjs
      - name: Verify registry assets
        run: |
          curl --fail --silent --show-error "$ACCEPTANCE_ORIGIN/agent-registry-mark.svg" >/dev/null
          curl --fail --silent --show-error "$ACCEPTANCE_ORIGIN/agent-registry-feature.svg" >/dev/null

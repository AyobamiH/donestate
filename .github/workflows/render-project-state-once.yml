name: Harden lease-expiry test once

on:
  push:
    branches:
      - automation/render-project-state-20260904

permissions:
  contents: write

jobs:
  harden-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/render-project-state-20260904
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Preserve helper and switch to closure branch
        run: |
          cp .github/scripts/harden-lease-test.mjs /tmp/harden-lease-test.mjs
          git fetch origin governance/record-active-main-protection-20260904
          git checkout governance/record-active-main-protection-20260904
      - name: Apply deterministic test repair and canonical evidence
        run: node /tmp/harden-lease-test.mjs
      - name: Render and validate
        run: |
          node scripts/render-project-state.mjs
          npm ci
          npm run check
          npm run governance:impact -- a802384ca6cf7fa7596b952a2e4654be71b6a292
      - name: Commit exact-head repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test/store.test.ts governance/project-ledger.json docs/PROJECT-STATE.md
          git commit -m "Make lease-expiry recovery test deterministic"
          git push origin HEAD:governance/record-active-main-protection-20260904

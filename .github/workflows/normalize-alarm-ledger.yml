name: Normalize alarm-sliced governance diff

on:
  push:
    branches:
      - repair/resume-implementation-across-alarms

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message == 'Normalize alarm-sliced governance diff'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Restore base formatting with only intended governance semantics
        env:
          BASE_SHA: b4febe960fc7e71d48049e3a758256c1b61841ef
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_SHA:governance/project-ledger.json" > "$RUNNER_TEMP/base-ledger.json"
          python - <<'PY'
          from pathlib import Path
          import json
          base = Path('/home/runner/work/_temp/base-ledger.json').read_text()
          desired = json.loads(Path('governance/project-ledger.json').read_text())

          def desired_item(item_id):
              return next(x for x in desired['workItems'] if x['id'] == item_id)

          def patch_work_item(text, item_id):
              item = desired_item(item_id)
              marker = f'"id":"{item_id}"'
              start = text.index(marker)
              line_start = text.rfind('\n', 0, start) + 1
              # Work-item block ends at the first 4-space object close after the id.
              end_marker = '\n    },'
              end = text.index(end_marker, start)
              block = text[line_start:end]
              lines = block.splitlines()
              found = False
              for i, line in enumerate(lines):
                  if '"nextAction":' in line and '"waitCondition":' in line and '"evidenceIds":' in line:
                      indent = line[:len(line)-len(line.lstrip())]
                      # Preserve reentry/dependencies from desired canonical semantics as well.
                      lines[i] = (
                          indent
                          + '"nextAction":' + json.dumps(item['nextAction'], ensure_ascii=False)
                          + ',"waitCondition":' + json.dumps(item['waitCondition'], ensure_ascii=False)
                          + ',"reentryCondition":' + json.dumps(item['reentryCondition'], ensure_ascii=False)
                          + ',"dependencies":' + json.dumps(item['dependencies'], separators=(',', ':'), ensure_ascii=False)
                          + ',"evidenceIds":' + json.dumps(item['evidenceIds'], separators=(',', ':'), ensure_ascii=False)
                      )
                      found = True
                      break
              if not found:
                  raise SystemExit(f'work-item layout drifted for {item_id}')
              new_block = '\n'.join(lines)
              return text[:line_start] + new_block + text[end:]

          text = base
          text = patch_work_item(text, 'VERIFY-006')
          text = patch_work_item(text, 'VERIFY-004')

          story = next(x for x in desired['evidenceStories'] if x['id'] == 'E-030')
          if '"id":"E-030"' in text:
              raise SystemExit('E-030 unexpectedly exists in base ledger')
          a = story['accountability']
          evidence = (
              '    ,{\n'
              + '      "id":' + json.dumps(story['id'])
              + ',"date":' + json.dumps(story['date'])
              + ',"identity":' + json.dumps(story['identity'])
              + ',"situation":' + json.dumps(story['situation'])
              + ',"verification":' + json.dumps(story['verification']) + ',\n'
              + '      "accountability":{"owner":' + json.dumps(a['owner'])
              + ',"status":' + json.dumps(a['status'])
              + ',"nextAction":' + json.dumps(a['nextAction'])
              + ',"waitCondition":' + json.dumps(a['waitCondition'])
              + ',"staleDate":' + json.dumps(a['staleDate']) + '},\n'
              + '      "outcome":' + json.dumps(story['outcome'])
              + ',"content":' + json.dumps(story['content'])
              + ',"measurement":' + json.dumps(story['measurement']) + '\n'
              + '    }'
          )
          marker = '\n  ]\n}'
          if text.count(marker) != 1:
              raise SystemExit('evidence tail layout drifted')
          text = text.replace(marker, '\n' + evidence + marker)
          Path('governance/project-ledger.json').write_text(text)
          PY
      - name: Render generated project state
        run: npm run governance:render
      - name: Validate exact clean tree
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check
          (cd apps/mcp-worker && npm ci && npm run check)
          node scripts/validate-plugin.mjs
          npm run governance:impact -- b4febe960fc7e71d48049e3a758256c1b61841ef
      - name: Publish normalized exact review commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/normalize-alarm-ledger.yml
          expected=$(printf '%s\n' \
            apps/mcp-worker/src/executor.ts \
            apps/mcp-worker/src/coordinator.ts \
            apps/mcp-worker/test/executor.test.ts \
            apps/mcp-worker/test/coordinator.test.ts \
            docs/PROJECT-STATE.md \
            governance/project-ledger.json | sort -u)
          actual=$( { git diff --name-only b4febe960fc7e71d48049e3a758256c1b61841ef; git ls-files --others --exclude-standard; } | sed '/^$/d' | sort -u )
          test "$actual" = "$expected"
          git diff --check
          git config user.name 'Ayobami Haastrup'
          git config user.email '47716486+AyobamiH@users.noreply.github.com'
          git add apps/mcp-worker/src/executor.ts apps/mcp-worker/src/coordinator.ts apps/mcp-worker/test/executor.test.ts apps/mcp-worker/test/coordinator.test.ts docs/PROJECT-STATE.md governance/project-ledger.json
          git add -u .github/workflows/normalize-alarm-ledger.yml
          git commit -m 'Normalize alarm-sliced governance evidence'
          git push origin HEAD:repair/resume-implementation-across-alarms

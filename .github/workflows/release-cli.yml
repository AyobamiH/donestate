name: Stage CLI release to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact package.json version to stage (for example 0.1.3)
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: donestate-cli-npm-stage
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use npm with staged publishing support
        run: npm install --global npm@11.19.0

      - name: Verify requested package version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const releaseVersion = process.env.RELEASE_VERSION;
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));

          if (!/^\d+\.\d+\.\d+$/.test(releaseVersion ?? "")) {
            throw new Error(`invalid release version: ${releaseVersion ?? "<missing>"}`);
          }
          if (pkg.name !== "donestate") {
            throw new Error(`unexpected package name: ${pkg.name}`);
          }
          if (pkg.version !== releaseVersion) {
            throw new Error(`package.json is ${pkg.version}, not requested ${releaseVersion}`);
          }
          NODE

      - name: Refuse an already-published version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          npm view donestate versions --json > "${RUNNER_TEMP}/donestate-versions.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const releaseVersion = process.env.RELEASE_VERSION;
          const versions = JSON.parse(
            readFileSync(`${process.env.RUNNER_TEMP}/donestate-versions.json`, "utf8"),
          );
          const published = Array.isArray(versions) ? versions : [versions];
          if (published.includes(releaseVersion)) {
            throw new Error(`donestate@${releaseVersion} is already published`);
          }
          NODE

      - name: Install exact dependencies
        run: npm ci

      - name: Run release checks
        run: npm run check

      - name: Stage package for maintainer review
        run: npm stage publish

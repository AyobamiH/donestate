name: Deploy hosted Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/chatgpt-plugin-0.2.0
    paths:
      - apps/mcp-worker/**
      - '!apps/mcp-worker/src/cli-acceptance-worker.ts'
      - '!apps/mcp-worker/wrangler.cli-acceptance.jsonc'
      - .github/workflows/deploy-worker.yml

permissions:
  contents: read

concurrency:
  group: donestate-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mcp-worker/package-lock.json
      - run: npm ci
        working-directory: apps/mcp-worker
      - run: npm run check
        working-directory: apps/mcp-worker
      - name: Validate required deployment secrets
        env:
          GITHUB_CLIENT_ID: ${{ secrets.DONESTATE_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.DONESTATE_GITHUB_CLIENT_SECRET }}
          GITHUB_MARKETPLACE_WEBHOOK_SECRET: ${{ secrets.DONE_STATE_GITHUB_MARKETPLACE_WEBHOOK_SECRET }}
        run: |
          if [ -z "$GITHUB_CLIENT_ID" ] || [ -z "$GITHUB_CLIENT_SECRET" ] || [ -z "$GITHUB_MARKETPLACE_WEBHOOK_SECRET" ]; then
            echo "DONESTATE_GITHUB_CLIENT_ID, DONESTATE_GITHUB_CLIENT_SECRET and DONE_STATE_GITHUB_MARKETPLACE_WEBHOOK_SECRET must be configured as repository Actions secrets" >&2
            exit 1
          fi
      - name: Ensure persistent user credential encryption key
        working-directory: apps/mcp-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx wrangler secret list --name donestate-mcp --format json | jq -e '.[] | select(.name == "USER_CREDENTIAL_ENCRYPTION_KEY")' >/dev/null; then
            echo "User credential encryption key is already configured"
          else
            openssl rand -base64 32 | npx wrangler secret put USER_CREDENTIAL_ENCRYPTION_KEY --name donestate-mcp
          fi
      - id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/mcp-worker
          wranglerVersion: 4.127.0
          packageManager: npm
          command: deploy
          secrets: |
            COOKIE_ENCRYPTION_KEY
            GITHUB_CLIENT_ID
            GITHUB_CLIENT_SECRET
            GITHUB_MARKETPLACE_WEBHOOK_SECRET
            TOKEN_ENCRYPTION_KEY
        env:
          COOKIE_ENCRYPTION_KEY: ${{ secrets.COOKIE_ENCRYPTION_KEY }}
          GITHUB_CLIENT_ID: ${{ secrets.DONESTATE_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.DONESTATE_GITHUB_CLIENT_SECRET }}
          GITHUB_MARKETPLACE_WEBHOOK_SECRET: ${{ secrets.DONE_STATE_GITHUB_MARKETPLACE_WEBHOOK_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      - name: Verify agent discovery and emit bounded crawler canary
        run: |
          set -euo pipefail
          curl --fail --silent --show-error -A "GPTBot/1.2" https://donestate.proofandstate.com/agents.txt > /tmp/agents.txt
          grep --fixed-strings --quiet "https://donestate.proofandstate.com/mcp" /tmp/agents.txt
          curl --fail --silent --show-error -A "OAI-SearchBot/1.0" https://donestate.proofandstate.com/llms.txt > /tmp/llms.txt
          grep --fixed-strings --quiet "DoneState" /tmp/llms.txt
          curl --fail --silent --show-error https://donestate.proofandstate.com/robots.txt | grep --fixed-strings --quiet "OAI-SearchBot"
      - name: Record deployment URL
        run: echo "### ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"

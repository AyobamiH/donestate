name: Agent Shop Registry Deploy Bridge

on:
  push:
    branches:
      - ops/agent-shop-registry-deploy-20261008
    paths:
      - ".github/workflows/agent-shop-registry-deploy-bridge.yml"

permissions:
  contents: read

concurrency:
  group: agent-shop-registry-deploy-bridge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACCEPTANCE_ORIGIN: https://agents.proofandstate.com
      VITE_SITE_ORIGIN: https://agents.proofandstate.com
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AGENT_SHOP_REVISION: d48538088ddb1c744e56bbda807e82d98cc5b2b1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Verify bounded authority
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Fetch exact canonical Agent Shop revision
        run: |
          git clone --filter=blob:none https://github.com/AyobamiH/agent-shop-products.git agent-shop-products
          cd agent-shop-products
          git checkout "$AGENT_SHOP_REVISION"
          test "$(git rev-parse HEAD)" = "$AGENT_SHOP_REVISION"
      - name: Install and build
        working-directory: agent-shop-products/frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Validate Cloudflare Worker bundle
        working-directory: agent-shop-products/frontend
        run: bunx wrangler@4.135.0 deploy --dry-run --config wrangler.jsonc --outdir /tmp/agent-shop-worker
      - name: Deploy exact Agent Shop revision
        working-directory: agent-shop-products/frontend
        run: bunx wrangler@4.135.0 deploy --config wrangler.jsonc
      - name: Wait for edge convergence
        run: |
          for i in {1..60}; do
            if curl --fail --silent --show-error --location "$ACCEPTANCE_ORIGIN/agents" >/dev/null; then
              echo "Production origin reachable."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Production origin did not converge."
          exit 1
      - name: Outside-in registry acceptance
        working-directory: agent-shop-products/frontend
        run: node scripts/verify-deployed-surface.mjs
      - name: Verify redesigned identity and 21-product catalogue
        run: |
          curl --fail --silent --show-error "$ACCEPTANCE_ORIGIN/agent-registry-mark.svg" > /tmp/mark.svg
          grep -q "2563EB" /tmp/mark.svg
          curl --fail --silent --show-error "$ACCEPTANCE_ORIGIN/catalog.json" > /tmp/catalog.json
          node - <<'NODE'
          const fs = require("node:fs");
          const body = JSON.parse(fs.readFileSync("/tmp/catalog.json", "utf8"));
          if (body.productCount !== 21) throw new Error(`Expected 21 products, got ${body.productCount}`);
          if (!body.products.some((p) => p.id === "agent-subcontracting-commercial-handoff")) {
            throw new Error("Missing agent subcontracting commercial handoff product");
          }
          console.log("Registry identity and 21-product catalogue verified.");
          NODE
